# Per-attempt gateway proxy for the O1 topology (README "Security posture";
# docs/decisions/2026-09-28-openhands-resolver-isolation.md).
#
# Composed locally from documented nginx directives; no upstream ships this
# file. Directive sources, fetched 2026-09-28: nginx.org ngx_http_core_module
# (location, limit_except, merge_slashes, client_max_body_size),
# ngx_http_proxy_module (proxy_pass, proxy_pass_request_headers,
# proxy_set_header, proxy_http_version, proxy_buffering,
# proxy_request_buffering) and ngx_http_rewrite_module (if, return). Source
# lines cite nginx/nginx release-1.30.5 (4556c714).
#
# host.py render_proxy_config fills the four placeholders (gateway port,
# server name, run id, compression combo) from recipe.arm_config and the
# attempt identity, and refuses any value outside its own pattern.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    server_tokens off;
    access_log /dev/stdout;
    # The default combined format logs the whole request line, "$request"
    # (src/http/modules/ngx_http_log_module.c:230-232). The host side uses this
    # one instead, so its access log does not copy a URI sent to gw:8080.
    # Request-bound error-log entries still carry the request line
    # (src/http/ngx_http_request.c:4103-4107). log_format is accepted only at
    # http level (NGX_HTTP_MAIN_CONF, ngx_http_log_module.c:170-171).
    log_format ingress '$time_iso8601 $request_method $status';

    # Agent side: gw:8081, reached from the internal run network.
    server {
        listen 8081;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # A proxy_pass that carries a URI still appends the request arguments
        # (ngx_http_proxy_module.c:1240-1251,1365-1384). $is_args is "?"
        # exactly when arguments exist (ngx_http_variables.c:1609-1624) and is
        # never "0", so no agent-chosen query string reaches the gateway.
        if ($is_args) { return 403; }
        # Header allowlist: no client header reaches the gateway unless it is
        # set here. A header whose value is empty is not sent
        # (ngx_http_proxy_module.c:1301-1303,1417-1418), so the control arm's
        # empty compression value drops that header.
        proxy_pass_request_headers off;
        proxy_set_header Host                    "10.0.2.2:@PORT@";
        proxy_set_header Content-Type            $content_type;
        proxy_set_header Accept                  $http_accept;
        proxy_set_header Idempotency-Key         $http_idempotency_key;
        proxy_set_header Authorization           "Bearer local-loopback";
        proxy_set_header X-Correlation-Id        "@RUN@";
        proxy_set_header x-omniroute-session     "@RUN@";
        proxy_set_header x-omniroute-compression "@COMPRESSION@";
        # Exact matches on the normalized URI (percent-decoding, dot segments
        # and merged slashes are resolved first); each forwards to one fixed
        # upstream URI, and limit_except refuses every other method.
        location = /v1/responses        { limit_except POST { deny all; } proxy_pass http://10.0.2.2:@PORT@/v1/responses; }
        location = /v1/chat/completions { limit_except POST { deny all; } proxy_pass http://10.0.2.2:@PORT@/v1/chat/completions; }
        location = /v1/models           { limit_except GET  { deny all; } proxy_pass http://10.0.2.2:@PORT@/v1/models; }
        location / { return 403; }
    }

    # Host side: 127.0.0.1:<port> is published to 8080 and forwarded to the
    # attempt's agent-server. The dispatch driver's event search carries a
    # query string, so this block has no argument refusal. Its access log
    # records time, method and status only; the agent side (8081) keeps the
    # combined format, which P5 triage reads.
    server {
        listen 8080;
        access_log /dev/stdout ingress;
        client_max_body_size 50m;
        proxy_read_timeout 900s;
        location / { proxy_pass http://@SERVER@:8000; }
    }
}
