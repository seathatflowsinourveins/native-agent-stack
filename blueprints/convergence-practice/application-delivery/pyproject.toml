[project]
name = "scoped-run-ledger"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.53.0",
  "alembic==1.20.0",
  "sqlalchemy==2.0.54",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.13.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend"]
