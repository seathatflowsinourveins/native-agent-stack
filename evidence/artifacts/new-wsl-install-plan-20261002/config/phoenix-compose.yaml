# SOURCE-ONLY, UNRUN. Phoenix tagged docker.mdx:156-171 SQLite Compose example.
services:
  phoenix:
    image: arizephoenix/phoenix:20.19.0
    ports:
      - "127.0.0.1:21606:6006"
      - "127.0.0.1:21617:4317"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
volumes:
  phoenix_data:
    driver: local
