; SOURCE-ONLY, UNRUN. grafana v13.2.3 conf/defaults.ini:50-53.
; Use upstream foreground grafana server with explicit --homepath and --config.
[paths]
data = @DATA_ROOT@/grafana
logs = @DATA_ROOT@/grafana/logs
plugins = @DATA_ROOT@/grafana/plugins
provisioning = @CONFIG_ROOT@/grafana-provisioning

[server]
http_addr = 127.0.0.1
http_port = 21301

; Upstream conf/defaults.ini:117-119; constrain optional auxiliary gRPC too.
[grpc_server]
network = tcp
address = 127.0.0.1:21302

[users]
allow_sign_up = false
; grafana v13.2.3 conf/defaults.ini:468,759,1077: local anonymous Viewer only.
[security]
disable_initial_admin_creation = true
[auth]
disable_login_form = true
[auth.basic]
enabled = false
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
