# Native harness: prometheus/prometheus@v3.15.0:docs/configuration/unit_testing_rules.md:6.
# Synthetic rule inputs; they are not a real notification receipt.
rule_files: [prometheus-alerts.yaml]
evaluation_interval: 5s
tests:
  - interval: 5s
    input_series:
      - series: 'up{job="prometheus",instance="127.0.0.1:21090"}'
        values: '0+0x25 1+0x4'
      - series: 'up{job="acceptance-fixture",instance="127.0.0.1:21997"}'
        values: '0+0x3 1+0x26'
    alert_rule_test:
      - eval_time: 115s
        alertname: EcosystemServiceUnavailable
        exp_alerts: []
      - eval_time: 120s
        alertname: EcosystemServiceUnavailable
        exp_alerts:
          - exp_labels: {job: prometheus, instance: '127.0.0.1:21090', severity: warning, scope: local-ecosystem}
            exp_annotations: {summary: 'Local service prometheus is unavailable'}
      - eval_time: 130s
        alertname: EcosystemServiceUnavailable
        exp_alerts: []
      - eval_time: 5s
        alertname: EcosystemAcceptanceTargetDown
        exp_alerts: []
      - eval_time: 10s
        alertname: EcosystemAcceptanceTargetDown
        exp_alerts:
          - exp_labels: {job: acceptance-fixture, instance: '127.0.0.1:21997', severity: test, scope: synthetic-acceptance}
            exp_annotations: {summary: 'Controlled local acceptance target is unavailable'}
      - eval_time: 20s
        alertname: EcosystemAcceptanceTargetDown
        exp_alerts: []

  # ---- 2026-10-06 (docs/decisions/2026-10-06-ns2604-alerting.md): clock, service-check, Alertmanager and
  # rule-failure scenarios, and a port of tests/test_observability_backends_alerts.py RootFilesystemRuleTests
  # to system_filesystem_usage_bytes. Synthetic series; Prometheus scrapes are modelled at the stated interval,
  # and "stale" stands for the exporter dropping a series. Generated once, then reviewed; not a live receipt.
  - name: 'clock CRIT: a first line starts a new series that increase() alone cannot see'
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x160}
    - {series: 'clock_offset_check_lines_total{level="crit",reason="sample"}', values: _x40 1x19 stale}
    alert_rule_test:
    - eval_time: 9m55s
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
    - eval_time: 10m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 14m45s
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 15m5s
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
  - name: 'clock CRIT: an increment of a series older than the window'
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x160}
    - {series: 'clock_offset_check_lines_total{level="crit",reason="sample"}', values: 1x80 2x60}
    alert_rule_test:
    - eval_time: 5m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 12m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
    - eval_time: 20m15s
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 29m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 31m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
  - name: 'clock CRIT: a series stale for more than five minutes returns at a higher cumulative value'
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x160}
    - {series: 'clock_offset_check_lines_total{level="crit",reason="sample"}', values: 1x19 stale _x60 2x19 stale}
    alert_rule_test:
    - eval_time: 1m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 6m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
    - eval_time: 20m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
    - eval_time: 20m15s
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 25m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 25m30s
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
  - name: 'clock CRIT: a Collector restart resets the counter to 1'
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x160}
    - {series: 'clock_offset_check_lines_total{level="crit",reason="sample"}', values: 3x60 stale _x3 1x20}
    alert_rule_test:
    - eval_time: 12m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
    - eval_time: 16m15s
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 20m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: sample, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason sample), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 27m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
  - name: clock WARN, an unparsed line and a CRIT error reason
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x160}
    - {series: 'clock_offset_check_lines_total{level="warn",reason="sample"}', values: _x4 1x10}
    - {series: 'clock_offset_check_lines_total{level="other",reason="sample"}', values: _x8 1x10}
    - {series: 'clock_offset_check_lines_total{level="crit",reason="chronyc_failed"}', values: _x4 1x10}
    alert_rule_test:
    - eval_time: 55s
      alertname: EcosystemClockOffsetWarning
      exp_alerts: []
    - eval_time: 3m
      alertname: EcosystemClockOffsetWarning
      exp_alerts:
      - exp_labels: {level: warn, reason: sample, severity: warning, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged WARN, description: 'A WARN line reached Prometheus in the last 10 minutes: the error bound passed 50 ms, the reference is missing or stale, the leap status is not Normal, or clock-change-check recorded a clock step or zone change. The line''s why= field names the cause: journalctl -t clock-offset-check -n 20.'}
    - eval_time: 3m
      alertname: EcosystemClockOffsetCheckUnparsed
      exp_alerts:
      - exp_labels: {level: other, reason: sample, severity: warning, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: 'clock-offset-check logged a line that is not OK, WARN or CRIT', description: 'The Collector could not classify a clock-offset-check line, so a changed output format could hide a CRIT. Compare the script with transform/clock_offset_check in otel.yaml.'}
    - eval_time: 3m
      alertname: EcosystemClockOffsetCritical
      exp_alerts:
      - exp_labels: {level: crit, reason: chronyc_failed, severity: critical, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: clock-offset-check logged CRIT (reason chronyc_failed), description: 'A CRIT line reached Prometheus in the last 10 minutes. reason=sample: the shared WSL clock was more than 100 ms off; any other reason: chronyd is missing or runs without -x, or chronyc failed or answered malformed or empty. Read journalctl -t clock-offset-check -n 20. A Collector start without its stored cursor counts the current boot''s earlier lines again.'}
    - eval_time: 3m
      alertname: EcosystemClockOffsetCheckSilent
      exp_alerts: []
  - name: 'clock monitor silent: no line for ten minutes, then five more'
    interval: 15s
    input_series:
    - {series: 'clock_offset_check_lines_total{level="ok",reason="sample"}', values: 1+0.25x79 stale}
    alert_rule_test:
    - eval_time: 19m
      alertname: EcosystemClockOffsetCheckSilent
      exp_alerts: []
    - eval_time: 29m
      alertname: EcosystemClockOffsetCheckSilent
      exp_alerts: []
    - eval_time: 34m
      alertname: EcosystemClockOffsetCheckSilent
      exp_alerts: []
    - eval_time: 35m
      alertname: EcosystemClockOffsetCheckSilent
      exp_alerts:
      - exp_labels: {severity: warning, scope: local-ecosystem, component: clock}
        exp_annotations: {summary: No clock-offset-check line has reached Prometheus for 15 minutes, description: 'The every-minute timer, the script, the Collector''s journald receiver or the otel-native scrape has stopped. Missing data is unknown, not a healthy clock.'}
    - eval_time: 35m
      alertname: EcosystemClockOffsetCritical
      exp_alerts: []
  - name: 'http_check: OmniRoute turns unhealthy, Dagu is missing, Ollama is healthy'
    interval: 15s
    input_series:
    # Failure starts at 2m15s. The receiver emits the failed class without a code; the exporter retains the last
    # successful {2xx,200}=1 for its 5m expiration instead of emitting {2xx,200}=0.
    - {series: 'httpcheck_status{http_url="http://127.0.0.1:21128/api/health",http_status_class="2xx",http_status_code="200",http_method="GET"}', values: 1x28 stale}
    - {series: 'httpcheck_status{http_url="http://127.0.0.1:21128/api/health",http_status_class="2xx",http_method="GET"}', values: _x8 0x40}
    - {series: 'httpcheck_status{http_url="http://127.0.0.1:21434/api/version",http_status_class="2xx",http_status_code="200",http_method="GET"}', values: 1x30}
    alert_rule_test:
    - eval_time: 2m
      alertname: EcosystemOmniRouteHealthUnexpected
      exp_alerts: []
    - eval_time: 4m10s
      alertname: EcosystemOmniRouteHealthUnexpected
      exp_alerts: []
    - eval_time: 4m15s
      alertname: EcosystemOmniRouteHealthUnexpected
      exp_alerts: []
    - eval_time: 9m10s
      alertname: EcosystemOmniRouteHealthUnexpected
      exp_alerts: []
    - eval_time: 9m15s
      alertname: EcosystemOmniRouteHealthUnexpected
      exp_alerts:
      - exp_labels: {severity: warning, scope: local-ecosystem, component: OmniRoute}
        exp_annotations: {summary: Local OmniRoute health response is unexpected or missing, description: 'Expected 2xx at http://127.0.0.1:21128/api/health, OmniRoute''s unauthenticated liveness route; this checks transport, not provider or job execution. After a healthy response, an outage takes about 7 minutes to alert: 5-minute metric expiration plus the 2-minute hold, with collection/scrape/evaluation alignment.'}
    - eval_time: 1m55s
      alertname: EcosystemDaguHealthUnexpected
      exp_alerts: []
    - eval_time: 2m
      alertname: EcosystemDaguHealthUnexpected
      exp_alerts:
      - exp_labels: {severity: warning, scope: local-ecosystem, component: Dagu}
        exp_annotations: {summary: Local Dagu health response is unexpected or missing, description: 'Expected 2xx at http://127.0.0.1:21080/api/v1/health, the route Dagu''s installer probes; DAG runs and the login are checked separately. After a healthy response, an outage takes about 7 minutes to alert: 5-minute metric expiration plus the 2-minute hold, with collection/scrape/evaluation alignment.'}
    - eval_time: 5m
      alertname: EcosystemOllamaHealthUnexpected
      exp_alerts: []
  - name: Alertmanager fails 10% of Telegram notifications; webhook stays healthy
    interval: 1m
    input_series:
    - {series: 'alertmanager_notifications_total{job="alertmanager",instance="alertmanager",integration="telegram"}', values: 0+10x30}
    - {series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="alertmanager",integration="telegram",reason="serverError"}', values: 0+1x30}
    - {series: 'alertmanager_notifications_total{job="alertmanager",instance="alertmanager",integration="webhook"}', values: 0+10x30}
    - {series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="alertmanager",integration="webhook",reason="serverError"}', values: '0x30'}
    alert_rule_test:
    - eval_time: 5m55s
      alertname: AlertmanagerFailedToSendAlerts
      exp_alerts: []
    - eval_time: 6m
      alertname: AlertmanagerFailedToSendAlerts
      exp_alerts:
      - exp_labels: {job: alertmanager, instance: alertmanager, integration: telegram, reason: serverError, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: An Alertmanager instance failed to send notifications., description: Alertmanager failed to send 10% of notifications to telegram. With one receiver this alert may not reach the phone; read Alertmanager's journal and /api/v2/status.}
  - name: a rule group fails evaluations for fifteen minutes
    interval: 1m
    input_series:
    - {series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="prometheus",rule_group="failing"}', values: 0x5 1+1x25}
    - {series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="prometheus",rule_group="healthy"}', values: '0x30'}
    alert_rule_test:
    - eval_time: 20m55s
      alertname: PrometheusRuleFailures
      exp_alerts: []
    - eval_time: 21m
      alertname: PrometheusRuleFailures
      exp_alerts:
      - exp_labels: {job: prometheus, instance: prometheus, rule_group: failing, severity: critical, scope: local-ecosystem}
        exp_annotations: {summary: Prometheus is failing rule evaluations., description: Rule group failing has failed evaluations in the last 5 minutes for 15 minutes; its alerts cannot fire. Read /api/v1/rules for the rule whose health is err.}
  - name: 'filesystem: the 24-hour filling warning fires after one hour and resolves at 40%'
    interval: 1m
    input_series:
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="free"}', values: 375809638400-322122547.2x360 429496729600x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="used"}', values: 644245094400+322122547.2x360 590558003200x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="reserved"}', values: 53687091200x360 53687091200x9}
    alert_rule_test:
    - eval_time: 60m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts: []
    - eval_time: 61m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
    - eval_time: 6h
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
    - eval_time: 6h1m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts: []
  - name: 'filesystem: the 4-hour filling critical needs its own prediction and resolves'
    interval: 1m
    input_series:
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="free"}', values: 268435456000-322122547.2x660 536870912000x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="used"}', values: 751619276800+322122547.2x660 483183820800x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="reserved"}', values: 53687091200x660 53687091200x9}
    alert_rule_test:
    - eval_time: 60m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts: []
    - eval_time: 61m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
    - eval_time: 653m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
    - eval_time: 654m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: critical, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within four hours, description: 'Less than 20% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within four hours, sustained for one hour. Inspect active scratch writers and stop recursive checkout copies.'}
    - eval_time: 660m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within 24 hours, description: 'Less than 40% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within 24 hours, sustained for one hour. Reserved bytes count toward size, not available space.'}
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: critical, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem is predicted to run out of space within four hours, description: 'Less than 20% of total filesystem bytes are available to ordinary writers, and the six-hour free-space trend predicts exhaustion within four hours, sustained for one hour. Inspect active scratch writers and stop recursive checkout copies.'}
    - eval_time: 661m
      alertname: EcosystemRootFilesystemSpaceFillingUp
      exp_alerts: []
  - name: 'filesystem: below 5% (reserve counted in size) warns and resolves'
    interval: 1m
    input_series:
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="free"}', values: 51539607552x31 214748364800x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="used"}', values: 968515125248x31 805306368000x9}
    - {series: 'system_filesystem_usage_bytes{device="root-test",mode="rw",mountpoint="/",type="ext4",job="otel-native",instance="host-test",state="reserved"}', values: 53687091200x41}
    alert_rule_test:
    - eval_time: 29m
      alertname: EcosystemRootFilesystemAlmostOutOfSpace
      exp_alerts: []
    - eval_time: 30m
      alertname: EcosystemRootFilesystemAlmostOutOfSpace
      exp_alerts:
      - exp_labels: {device: root-test, mode: rw, mountpoint: /, type: ext4, job: otel-native, instance: host-test, state: free, severity: warning, scope: local-ecosystem}
        exp_annotations: {summary: WSL root filesystem has less than 5% available space, description: 'Available bytes have stayed below 5% of total filesystem bytes for 30 minutes. Available is the free state; size includes free, used and reserved states.'}
    - eval_time: 31m
      alertname: EcosystemRootFilesystemAlmostOutOfSpace
