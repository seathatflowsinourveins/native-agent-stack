# SOURCE-ONLY, UNRUN. grafana/loki v3.7.8 cmd/loki/loki-local-config.yaml.
# Bind keys documented docs/sources/shared/configuration.md:6196-6216.
auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 21300
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 21396
  log_level: debug
  grpc_server_max_concurrent_streams: 1000
common:
  instance_addr: 127.0.0.1
  path_prefix: ./data
  storage:
    filesystem:
      chunks_directory: ./data/chunks
      rules_directory: ./data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
limits_config:
  metric_aggregation_enabled: true
  enable_multi_variant_queries: true
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: 127.0.0.1:21300
frontend:
  encoding: protobuf
