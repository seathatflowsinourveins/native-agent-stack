# SOURCE-ONLY. prometheus/alertmanager@v0.34.1:docs/configuration.md:1862.
# The installer checks metadata only; the native receiver reads these private files.
route:
  receiver: user
  group_by: [alertname, job]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: user
    telegram_configs:
      - bot_token_file: @BOT_TOKEN_FILE@
        chat_id_file: @CHAT_ID_FILE@
        send_resolved: true
