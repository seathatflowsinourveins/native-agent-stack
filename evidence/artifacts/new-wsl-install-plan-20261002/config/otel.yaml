# SOURCE-ONLY, UNRUN. Adapted from upstream v0.162.0 distributions/otelcol-contrib/config.yaml.
# healthcheckextension/README.md:39-56 documents endpoint and path.
extensions:
  health_check:
    endpoint: 127.0.0.1:21333
    path: /health/status
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:21317
      http:
        endpoint: 127.0.0.1:21318
processors:
  batch: {}
exporters:
  debug:
    verbosity: detailed
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 21888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
                with_resource_constant_labels:
                  included: []
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  extensions: [health_check]
