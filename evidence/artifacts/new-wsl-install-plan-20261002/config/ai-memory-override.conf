# The stack's additions to ai-memory 3.1.0's systemd user unit. `ai-memory setup` writes and owns the unit
# (akitaonrails/ai-memory@11ca7c5b crates/ai-memory-cli/src/commands/user_service.rs:51-55 and 193-234), so the
# additions live in this drop-in and the unit keeps one writer (the CC's ruling D2 for PR (b) condition 4, 2026-10-17).
# systemd merges ai-memory.service.d/*.conf after the unit (systemd v259 man/systemd.unit.xml:203-207).
# CPUWeight=idle: man/systemd.resource-control.xml:187-209 at v259; MemoryHigh=: :376-384 (a throttling limit: the unit is slowed and its memory reclaimed) and MemoryMax=: :406 at v259. PATH follows the
# plan's other user units (config/dagu.service).
# MEASURED (the CC's ruling G5 for PR #1242, 2026-10-17): MemoryHigh=1G is the working limit and MemoryMax=2G the last line.
# Method (nhny-mipe's private receipt RECEIPT-g5-20261017.md, outside the repository, cited by name only): the run pin's
# binary on a scratch HOME and data dir, fresh `init`, the row's two config edits (a loopback bind and
# embedding_provider = "local", this row's in-process embedder). Each server start ran in its own transient user unit
# (MemoryMax 8G, swap 0, CPUWeight idle), so systemd's MemoryPeak covers exactly that start; it is the cgroup's peak, page
# cache charged to the unit included, the same quantity MemoryMax bounds.
# - Start 1, the model fetch and 50 embedded writes: MemoryPeak 362442752 bytes.
# - Start 2, startup, the row's acceptance checks and one hybrid search: MemoryPeak 201592832 bytes.
# Both bounds sit above the higher peak (MemoryHigh 2.96 times, MemoryMax 5.93 times). NOT MEASURED: a large store's startup
# backfill and a consolidation run; the load was 50 pages. A run that exceeds MemoryHigh is throttled and reclaimed before
# MemoryMax kills it, so a larger store shows as slowness first and a measured peak above MemoryHigh reopens this bound.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
CPUWeight=idle
MemoryHigh=1G
MemoryMax=2G
