receivers:
  otlp:
    protocols: {grpc: {endpoint: 127.0.0.1:34317}, http: {endpoint: 127.0.0.1:34318}}
  filelog:
    include: ["$HOME/.cache/gap-wave2-20260923/observability-hosting/paper-arm-7/dagu/logs/**/*.out", "$HOME/.cache/gap-wave2-20260923/observability-hosting/paper-arm-7/dagu/logs/**/*.err"]
    start_at: beginning
    include_file_path: true
    storage: file_storage
extensions:
  file_storage: {directory: $HOME/.cache/gap-wave2-20260923/observability-hosting/paper-arm-7/data/otelcol-storage}
connectors:
  spanmetrics: {metrics_flush_interval: 2s}
  count:
    logs:
      paper.runtime.log.records:
        description: runtime log lines of the paper-sim step
        conditions: ['IsMatch(body, "obsgap-paper-162216")']
      paper.runtime.intents:
        description: runtime intent events
        conditions: ['IsMatch(body, "obsgap-paper-162216") and IsMatch(body, "type.: .intent")']
exporters:
  prometheusremotewrite: {endpoint: "http://127.0.0.1:39090/api/v1/write"}
  otlphttp/loki: {logs_endpoint: "http://127.0.0.1:33100/otlp/v1/logs", tls: {insecure: true}}
  debug: {verbosity: basic}
  prometheus/count: {endpoint: 127.0.0.1:38889}
processors:
  batch: {timeout: 1s}
  resource/paperlogs:
    attributes: [{key: service.name, value: paper-obsgap-20260923, action: upsert}]
service:
  extensions: [file_storage]
  telemetry: {metrics: {level: none}}
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [spanmetrics, debug]}
    metrics: {receivers: [otlp, spanmetrics], processors: [batch], exporters: [prometheusremotewrite]}
    metrics/count: {receivers: [count], processors: [batch], exporters: [prometheus/count]}
    logs: {receivers: [filelog], processors: [resource/paperlogs, batch], exporters: [otlphttp/loki, count]}
