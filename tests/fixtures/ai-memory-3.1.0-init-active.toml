# Active TOML from ai-memory v3.1.0 at 11ca7c5b3b65e7fc216c7eae5a9aac67d38c11ea
# crates/ai-memory-cli/templates/config.default.toml; comments/blank lines omitted.
# init.rs:207-212 appends render_default_auth_block (active field token_pepper, init.rs:27-58) and, on a fresh
# data dir, render_bearer_token_file_line (init.rs:61-70) with the relative path auth-tokens/default.
# Tests supply a synthetic pepper after these lines; no native credential or init command is used.
bind = "127.0.0.1:49374"
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
log_level = "info"
[decay]
lambda = 0.02
sigma = 0.6
mu = 0.04
salience_default = 1.0
cold_threshold = 0.20
hard_delete_after_days = 180
breadth_weight = 0.0
observation_retention_days = 0     # 0 = never prune raw observations
observation_prune_batch = 5000     # rows per prune transaction
ledger_retention_months = 0        # 0 = never delete hook event ledgers
[sanitize]
extra_patterns = []
allowlist = []
[slots]
per_user = false
[consolidation]
max_input_tokens = 100000
max_output_tokens = 32000
[auto_improve]
require_approval = false
min_observations = 8
min_session_duration_secs = 120
min_confidence = 0.75
max_input_tokens = 24000
max_proposals_per_run = 5
include_raw_fallback = false
proposal_actor = "auto_improve"
pending_path = "_pending/auto-improve"
[auto_improve.eval]
enabled = false
command = ""
timeout_secs = 120
targets = ["_rules", "procedures"]
min_delta = 0.0
[auto_improve.scheduler]
enabled = true
interval_secs = 3600
max_sessions_per_tick = 1 # per project
min_session_age_secs = 600
[routing]
mid_session = "follow-cwd"
[auth]
secure_cookie = false
bearer_token_file = "auth-tokens/default"
