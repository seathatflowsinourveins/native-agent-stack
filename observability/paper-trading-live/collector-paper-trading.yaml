# Merge into the ecosystem OpenTelemetry Collector config (otelcol-contrib 0.161.0).
# Paper-trading run records -> local Loki. Bodies are kept (they are the manifest);
# account identifiers and AccountState balances/margins are redacted before export. Paths use the collector user's HOME.
receivers:
  file_log/paper_events:
    include: ["${env:HOME}/.local/state/native-agent-stack/alpaca-paper/live/*/events.jsonl"]
    start_at: beginning
    storage: file_storage
    include_file_name: false
    include_file_path: true
    max_log_size: 1MiB
    operators:
      - type: json_parser
        on_error: send_quiet
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.at
          layout_type: epoch
          layout: s.us
      - type: regex_parser
        on_error: send_quiet
        parse_from: attributes["log.file.path"]
        regex: '/live/(?P<run>[a-z0-9-]{1,24})/'
      - type: remove
        field: attributes["log.file.path"]
      - type: add
        field: resource["service.name"]
        value: adaptive-paper
  file_log/paper_nautilus:
    include: ["${env:HOME}/.local/state/native-agent-stack/alpaca-paper/live/*/nautilus/*.jsonl"]
    start_at: beginning
    storage: file_storage
    include_file_name: false
    include_file_path: true
    max_log_size: 1MiB
    operators:
      - type: json_parser
        on_error: send_quiet
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: regex_parser
        on_error: send_quiet
        parse_from: attributes["log.file.path"]
        regex: '/live/(?P<run>[a-z0-9-]{1,24})/'
      - type: remove
        field: attributes["log.file.path"]
      - type: add
        field: resource["service.name"]
        value: nautilus-trader
processors:
  transform/paper_trading:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(balances|margins)=\\[[^\\]]*\\]", "$$1=[redacted]")
          - replace_pattern(attributes["message"], "(balances|margins)=\\[[^\\]]*\\]", "$$1=[redacted]") where attributes["message"] != nil
          - replace_pattern(body, "ALPACA-PAPER-[0-9a-f]{8,64}", "ALPACA-PAPER-[redacted]")
          - replace_pattern(body, "[0-9a-f]{64}", "[redacted]")
          - replace_pattern(attributes["message"], "ALPACA-PAPER-[0-9a-f]{8,64}", "ALPACA-PAPER-[redacted]") where attributes["message"] != nil
          - replace_pattern(attributes["message"], "[0-9a-f]{64}", "[redacted]") where attributes["message"] != nil
          - delete_key(attributes, "color")
service:
  pipelines:
    logs/paper_trading:
      receivers: [file_log/paper_events, file_log/paper_nautilus]
      processors: [memory_limiter, transform/paper_trading, batch]
      exporters: [otlphttp/loki]
