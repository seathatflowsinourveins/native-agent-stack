# Evidence class: synthetic / local integration on a disposable GitHub-hosted
# runner. This exercises adoption/bootstrap-linux.sh's real installation path
# (pinned downloads, SHA-256 verification, isolated prefixes) against a fresh
# ubuntu-24.04 image every run; it is not a second-machine developer-laptop
# acceptance and does not sign into any native client.
name: Adoption bootstrap smoke

on:
  push:
    branches: [main]
    paths:
      - 'adoption/**'
      - 'tools/adoption/**'
      - 'tests/test_adoption_*.py'
      - 'scripts/validate.py'
      - 'scripts/validate_catalogs.py'
      - 'scripts/validate_foundation.py'
      - 'scripts/landscape.py'
      - 'scripts/build_ecosystem.py'
      - 'scripts/adoption_status.py'
      - 'blueprints/convergence-practice/wsl-native-tools/pins.json'
      - '.github/workflows/adoption-bootstrap.yml'
  pull_request:
    paths:
      - 'adoption/**'
      - 'tools/adoption/**'
      - 'tests/test_adoption_*.py'
      - 'scripts/validate.py'
      - 'scripts/validate_catalogs.py'
      - 'scripts/validate_foundation.py'
      - 'scripts/landscape.py'
      - 'scripts/build_ecosystem.py'
      - 'scripts/adoption_status.py'
      - 'blueprints/convergence-practice/wsl-native-tools/pins.json'
      - '.github/workflows/adoption-bootstrap.yml'
  schedule:
    - cron: '47 6 * * 1' # Weekly Monday 06:47 UTC re-check of live pinned downloads.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the manifest-supported Python line
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          check-latest: false
      - name: Run the bootstrap into a disposable prefix
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          bash adoption/bootstrap-linux.sh --profile foundation-cpu
      - name: Read the read-only adoption status report
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/eco/bin:$PATH"
          python3 scripts/adoption_status.py --profile foundation-cpu --json > status.json
          cat status.json
      - name: Assert every required command for the profile is present
        shell: bash
        run: |
          set -euo pipefail
          jq -e '[.profiles[].commands[] | select(.present == false)] | length == 0' status.json
      - name: Verify the installed native client versions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/eco/bin:$PATH"
          codex --version
          claude --version
          uv --version
          node --version
      - name: Upload the adoption status report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-bootstrap-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: status.json
          if-no-files-found: error
          retention-days: 7

  # Evidence class: native operation on a GitHub-hosted macOS arm64 runner
  # (macos-15, Apple Silicon, free minutes on this public repository). It is a
  # hosted smoke of adoption/bootstrap-macos.sh's pinned, checksum-verified
  # installation into a disposable $RUNNER_TEMP prefix plus the read-only
  # status report; it is NOT a Mac workstation acceptance and it signs into no
  # native client. A green run here never flips adoption/manifest.json's
  # macos-arm64 platform profile out of drafted_not_accepted, and never flips
  # scripts/adoption_status.py's platform.supported, which stays false because
  # supported_platforms pins linux/x86_64 only. Round 3h added the embedding
  # acceptance check (tools/adoption/embed_acceptance.py against a live
  # llama-embed launchd agent): this is HOSTED-RUNNER EVIDENCE ONLY -- a
  # GitHub-hosted macOS Apple Silicon runner is CPU-only, not a real Mac
  # workstation with Metal actually engaged, so a green run here establishes
  # the endpoint, the model and the request/response shape, never the Metal
  # backend a real Mac would use; see "Record which backend llama-server's
  # own log reports" below and adoption/platforms/macos-arm64.md.
  bootstrap-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # step-security/harden-runner's pinned version supports macOS runners
      # in audit mode (its README: "GitHub-hosted runners (Windows, macOS):
      # Audit mode only", read at this exact pinned commit 2026-09-23), which
      # is the only mode this project ever uses.
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the manifest-supported Python line
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          check-latest: false
      - name: Assert the runner is Apple Silicon and record the image
        shell: bash
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          if [ "$architecture" != "arm64" ]; then
            echo "expected an Apple Silicon runner; uname -m reported $architecture" >&2
            exit 1
          fi
          sw_vers | tee sw_vers.txt
      - name: Run the macOS bootstrap into a disposable prefix
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          bash adoption/bootstrap-macos.sh --profile macos-arm64-foundation --skip-system-packages
      - name: Read the read-only adoption status report
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/eco/bin:$PATH"
          # scripts/adoption_status.py exits 2 whenever the overall status is
          # prerequisites_missing, which is the expected outcome on darwin even
          # when every profile command is present: supported_platforms lists
          # linux/x86_64 only. Accept 0 or 2, fail on anything else.
          code=0
          python3 scripts/adoption_status.py --profile macos-arm64-foundation --json > status.json || code=$?
          cat status.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "adoption_status.py exited $code; only 0 or 2 is expected on darwin" >&2
            exit 1
          fi
          echo "adoption_status.py exit code: $code"
      - name: Assert the report is a real macos-arm64-foundation profile report
        shell: bash
        run: |
          set -euo pipefail
          # scripts/adoption_status.py returns an early error report -- manifest
          # status "invalid", "profiles": [] and a non-empty "errors" list -- and
          # still exits 2 when the manifest or the requested profile is broken.
          # Without these positive checks the emptiness assertions below would
          # pass vacuously on exactly the wiring failure this smoke must catch.
          jq -e '.manifest.status == "valid"' status.json
          jq -e '.errors | length == 0' status.json
          jq -e '[.profiles[] | select(.id == "macos-arm64-foundation")] | length == 1' status.json
          jq -e '[.profiles[] | select(.id == "macos-arm64-foundation")][0].commands | length >= 1' status.json
          jq -e '[.profiles[] | select(.id == "macos-arm64-foundation")][0].recipes | length >= 1' status.json
          jq -e '[.profiles[] | select(.id == "macos-arm64-foundation")][0].status == "prerequisites_present"' status.json
      - name: Assert every required command for the macOS profile is present
        shell: bash
        run: |
          set -euo pipefail
          jq -e '[.profiles[].commands[] | select(.present == false)] | length == 0' status.json
          jq -e '[.profiles[].recipes[] | select(.present == false)] | length == 0' status.json
      - name: Assert the platform report stays unsupported on darwin
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.platform.os == "darwin"' status.json
          jq -e '.platform.architecture == "arm64"' status.json
          jq -e '.platform.supported == false' status.json
      - name: Render the published example host's configs read-only
        shell: bash
        run: |
          set -euo pipefail
          # adoption/hosts/example.json is the committed placeholder host file;
          # render_config.py --out only writes into the chosen directory and
          # never reads or edits a live client config (--check does that).
          python3 tools/adoption/render_config.py --host example --out "$RUNNER_TEMP/rendered"
          ls -l "$RUNNER_TEMP/rendered"
      - name: Verify the installed native client versions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/eco/bin:$PATH"
          codex --version
          claude --version
          llama-server --version
          uv --version
          node --version
          # gh is NOT in the macos-arm64-foundation profile's required_commands
          # gh is installed by the bootstrap into $ECO_INSTALL_ROOT/bin, which is first on PATH here,
          # installed-versions.txt stays the authoritative pinned-version record.
          gh --version
      - name: Render and lint the launchd plists (drafted; not a workstation launchd run)
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          bash adoption/launchd/launchd-agents.sh render
          bash adoption/launchd/launchd-agents.sh lint
      # Round 3h (2026-09-23 readiness audit): the llama-embed launchd
      # agent's template ran with no model argument at all, so nothing had
      # ever proven the endpoint serves the pinned model correctly. Cached
      # by its own sha256 (adoption/pins-macos-arm64.json's models[0]), not
      # a version tag, so a changed pin -- a different hash -- always misses
      # the cache and re-downloads, rather than silently reusing a stale
      # cached file under a reused key.
      - name: Cache the pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/eco/state/models/embeddinggemma-300M-Q8_0.gguf
          key: macos-embed-model-b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63
      - name: Bootstrap the llama-embed launchd agent, run the embedding acceptance check, then boot it out
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          # The bootstrap step above already downloaded and sha256-verified
          # the model into this exact path via install_embed_model; the
          # cache step above may also have restored it there already
          # (fetch() is idempotent: it checks an existing destination's own
          # checksum before ever downloading again), so this is never a
          # second, redundant fetch either way.
          bash adoption/launchd/launchd-agents.sh install --label com.native-stack.llama-embed
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8232/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          acceptance_exit=0
          if [ "$healthy" -eq 1 ]; then
            python3 tools/adoption/embed_acceptance.py http://127.0.0.1:8232 \
              evidence/artifacts/macos-embed-reference-20260923/macos-embed-reference-20260923.json \
              > "$RUNNER_TEMP/embed-acceptance-result.json" || acceptance_exit=$?
            cat "$RUNNER_TEMP/embed-acceptance-result.json"
          else
            echo "llama-embed launchd agent never answered http://127.0.0.1:8232/ within 30s." >&2
            acceptance_exit=1
          fi
          cp "$ECO_INSTALL_ROOT/state/logs/com.native-stack.llama-embed.err.log" \
            "$RUNNER_TEMP/llama-embed-startup.log" 2>/dev/null || true
          bash adoption/launchd/launchd-agents.sh remove --label com.native-stack.llama-embed
          exit "$acceptance_exit"
      - name: Record which backend llama-server's own log reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/llama-embed-startup.log"
          if [ ! -f "$log" ]; then
            echo "No llama-embed startup log was captured (the agent likely never started); nothing to report."
            exit 0
          fi
          # This runner is CPU-only (no discrete GPU, and GitHub's macOS
          # Apple Silicon runners do not expose Metal to a sandboxed
          # process the way a real Mac workstation does); a real Mac run is
          # what would show Metal actually engaging. Best-effort only --
          # never fails the job on its own, and never asserts a specific
          # backend: llama.cpp's own startup log wording is not a stable
          # API this project should assume without checking (see the
          # launchctl(1) caveat in adoption/platforms/macos-arm64.md's
          # untested-boundary note for the same reasoning applied there).
          if grep -qi 'metal' "$log"; then
            echo "Backend reported in the startup log: Metal (see the uploaded llama-embed-startup.log for the exact line)."
          elif grep -qi -E 'cpu|blas' "$log"; then
            echo "Backend reported in the startup log: CPU (see the uploaded llama-embed-startup.log for the exact line)."
          else
            echo "Backend not identified from a fixed keyword search; inspect the uploaded llama-embed-startup.log directly."
          fi
      - name: Bootstrap the qdrant launchd agent, health-check it, then boot it out
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          # qdrant is a pinned, always-selected component of
          # macos-arm64-foundation (adoption/manifest.json, not editable from
          # here), so it must exist after a successful bootstrap above; its
          # absence here is a real failure to surface, not a reason to skip
          # quietly (qdrant is not itself in required_commands, so this
          # assertion is what actually catches its absence).
          if [ ! -x "$ECO_INSTALL_ROOT/bin/qdrant" ]; then
            echo "qdrant binary absent at $ECO_INSTALL_ROOT/bin/qdrant after a bootstrap that selects it; failing." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qdrant-smoke-storage" "$ECO_INSTALL_ROOT/config"
          # Disposable smoke config for this run only, not a shipped default.
          printf 'storage:\n  storage_path: %s\nservice:\n  http_port: 6333\n' \
            "$RUNNER_TEMP/qdrant-smoke-storage" > "$ECO_INSTALL_ROOT/config/qdrant.yaml"
          bash adoption/launchd/launchd-agents.sh install --label com.native-stack.qdrant
          healthy=0
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:6333/ >"$RUNNER_TEMP/qdrant-health.json"; then
              healthy=1
              break
            fi
            sleep 1
          done
          bash adoption/launchd/launchd-agents.sh remove --label com.native-stack.qdrant
          if [ "$healthy" -ne 1 ]; then
            echo "qdrant launchd agent never answered http://127.0.0.1:6333/ within 15s." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/qdrant-health.json"
          echo "qdrant launchd agent answered http://127.0.0.1:6333/ (bootstrapped, health-checked, then booted out)."
      - name: Collect the artifact payload
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p macos-status
          for file in status.json sw_vers.txt "$RUNNER_TEMP/eco/installed-versions.txt" "$RUNNER_TEMP/qdrant-health.json" \
                      "$RUNNER_TEMP/embed-acceptance-result.json" "$RUNNER_TEMP/llama-embed-startup.log"; do
            if [ -f "$file" ]; then
              cp "$file" macos-status/
            else
              echo "absent, not uploaded: $file"
            fi
          done
          ls -l macos-status
      - name: Upload the macOS adoption status report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-bootstrap-macos-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: macos-status
          # warn, not error: a failed bootstrap must stay visible as that
          # step's failure instead of being masked by a missing-artifact error.
          if-no-files-found: warn
          retention-days: 30

  # Evidence class: native operation on a GitHub-hosted macOS arm64 runner,
  # exercising the brew_formulae loop this change added to
  # adoption/bootstrap-macos.sh WITHOUT --skip-system-packages, so it is the
  # only job that actually invokes `brew install` for the six floating
  # formulae (jq, python@3.13, ripgrep, coreutils, restic, shellcheck). Like
  # bootstrap-macos above, this never flips adoption/manifest.json's
  # macos-arm64 platform profile out of drafted_not_accepted and signs into
  # no native client.
  bootstrap-macos-brew:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-python here on purpose: this job exists to exercise
      # the real brew_formulae loop (including python@3.13), and a
      # setup-python-provided interpreter could shadow python3.13 on PATH,
      # making the assertion below pass without ever checking Homebrew's own
      # install. GitHub's macos-15 image ships a system Python already,
      # which is all the script itself (bash + jq, no Python) needs.
      - name: Run the macOS bootstrap without --skip-system-packages
        shell: bash
        run: |
          set -euo pipefail
          export ECO_INSTALL_ROOT="$RUNNER_TEMP/eco"
          bash adoption/bootstrap-macos.sh --profile macos-arm64-foundation
      - name: Assert every brew-installed formula is actually present
        shell: bash
        run: |
          set -euo pipefail
          # python@3.13 is keg-only (it does not become the default python3),
          # and which exact opt-prefix subpath carries its own python3.13
          # binary is not asserted identically by every source consulted for
          # this check, so every plausible brew --prefix candidate is tried
          # explicitly, never a bare `python3.13` resolved from PATH alone.
          python313=""
          for candidate in \
            "$(brew --prefix)/bin/python3.13" \
            "$(brew --prefix python@3.13 2>/dev/null || true)/bin/python3.13" \
            "$(brew --prefix python@3.13 2>/dev/null || true)/libexec/bin/python3.13"; do
            if [ -x "$candidate" ]; then
              python313="$candidate"
              break
            fi
          done
          if [ -z "$python313" ]; then
            echo "python3.13 not found via any brew --prefix candidate; brew list --versions python@3.13:" >&2
            brew list --versions python@3.13 >&2 || true
            exit 1
          fi
          "$python313" --version
          rg --version
          restic version
          shellcheck --version
          gsha256sum --version

  # Evidence class: local integration on a GitHub-hosted macOS arm64 runner.
  # Runs this repository's own read-only validators and its adoption test
  # modules on Darwin/arm64, since every other job here exercises the
  # bootstrap script but never the repository's own Python tooling on macOS.
  # No account sign-in, no live provider call.
  validate-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the manifest-supported Python line
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          check-latest: false
      - name: Validate manifests and evidence integrity
        run: python3 scripts/validate.py
      - name: Validate catalog evidence and coverage joins
        run: python3 scripts/validate_catalogs.py
      - name: Validate general foundation capability claims
        run: python3 scripts/validate_foundation.py --root . --json
      - name: Validate landscape choices and alternative evidence
        run: python3 scripts/landscape.py --root .
      - name: Check offline ecosystem explorer rebuild
        run: python3 scripts/build_ecosystem.py --check
      - name: Gate on the adoption test modules
        run: >-
          python3 -m unittest
          tests.test_adoption_bootstrap_macos tests.test_adoption_launchd
          tests.test_adoption_contract tests.test_adoption_status
          tests.test_render_config tests.test_workflow_hardening
          tests.test_workflow_security_coverage
      - name: Run the full test suite (recorded, not gating on macOS)
        id: full_suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -m unittest -v >full-suite-macos.log 2>&1
          code=$?
          set -e
          echo "Full python3 -m unittest exit code on macOS: $code (recorded as an artifact; this step never fails the job)"
          exit 0
      - name: Upload the full test suite result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-bootstrap-full-suite-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-suite-macos.log
          if-no-files-found: warn
          retention-days: 30
