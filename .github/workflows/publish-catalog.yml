name: Publish attested catalog archive

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'seathatflowsinourveins/native-agent-stack' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for keyless signing of the archive attestation; this job only
      attestations: write # store the build-provenance attestation for the published archive
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Prepare publication evidence
        run: |
          PUBLICATION_DIR="$RUNNER_TEMP/catalog-publication"
          mkdir -p "$PUBLICATION_DIR"
          printf 'PUBLICATION_DIR=%s\n' "$PUBLICATION_DIR" >> "$GITHUB_ENV"
          printf 'repository=%s\ncommit=%s\nref=%s\nrun=https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$PUBLICATION_DIR/source.log"
          gh --version >> "$PUBLICATION_DIR/source.log"
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the catalog and recorded evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py 2>&1 | tee "$PUBLICATION_DIR/validation.log"
          python3 scripts/validate_catalogs.py 2>&1 | tee -a "$PUBLICATION_DIR/validation.log"
          python3 scripts/validate_foundation.py --root . --json 2>&1 | tee -a "$PUBLICATION_DIR/validation.log"
          python3 scripts/validate_convergence.py --all-recorded --root . --json 2>&1 | tee -a "$PUBLICATION_DIR/validation.log"
          python3 scripts/build_ecosystem.py --check | tee "$PUBLICATION_DIR/explorer-check.json" | tee -a "$PUBLICATION_DIR/validation.log"
      - name: Archive only the validated Git commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          archive="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --prefix=native-agent-stack/ --output="$archive" "$GITHUB_SHA"
          cd "$PUBLICATION_DIR"
          sha256sum "$(basename "$archive")" | tee archive.sha256
          stat --format='archive_bytes=%s' "$archive" | tee -a source.log
      - name: Build the public explorer
        shell: bash
        run: |
          set -euo pipefail
          # docs/ecosystem/index.html is generated, not committed (see
          # docs/decisions/2026-09-23-generated-explorer-sorted-manifest.md);
          # rebuild it from this validated commit and publish it as its own
          # attested artifact alongside the source archive.
          python3 scripts/build_ecosystem.py --write
          # Publish only the bytes --check verified: the rebuild must match its output_sha256.
          checked="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["output_sha256"])' "$PUBLICATION_DIR/explorer-check.json")"
          built="$(sha256sum docs/ecosystem/index.html | awk '{print $1}')"
          printf 'checked_explorer_sha256=%s\nbuilt_explorer_sha256=%s\n' "$checked" "$built" | tee "$PUBLICATION_DIR/explorer-build.log"
          test "$built" = "$checked"
          explorer="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.explorer.html"
          cp docs/ecosystem/index.html "$explorer"
          cd "$PUBLICATION_DIR"
          sha256sum "$(basename "$explorer")" | tee -a archive.sha256
      - name: Scan the built explorer for private content before attesting it
        shell: bash
        run: |
          set -euo pipefail
          # The build step above regenerates docs/ecosystem/index.html fresh
          # every run and it is gitignored (see
          # docs/decisions/2026-09-23-generated-explorer-sorted-manifest.md),
          # so "Validate the catalog and recorded evidence" above never saw
          # this exact file: scan_publication() only walks git-tracked/listed
          # paths. Scan the actual artifact that gets uploaded and attested.
          explorer="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.explorer.html"
          python3 scripts/validate.py --scan-file "$explorer" 2>&1 | tee -a "$PUBLICATION_DIR/validation.log"
      - name: Fetch and SHA-checked-verify syft
        shell: bash
        run: |
          set -euo pipefail
          syft_dir="$RUNNER_TEMP/syft-1.52.0"
          mkdir -p "$syft_dir"
          curl --fail --location --show-error --silent --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_checksums.txt' \
            --output "$syft_dir/checksums.txt"
          curl --fail --location --show-error --silent --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz' \
            --output "$syft_dir/syft.tar.gz"
          expected="$(grep '  syft_1.52.0_linux_amd64.tar.gz$' "$syft_dir/checksums.txt" | awk '{print $1}')"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$syft_dir/syft.tar.gz" | sha256sum --check --status
          # Pinned and independently re-verified 2026-09-22 against the upstream checksums file.
          test "$expected" = 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          install -m 0755 "$syft_dir/syft" "$RUNNER_TEMP/syft"
          "$RUNNER_TEMP/syft" version
      - name: Generate the SPDX SBOM for the archived commit
        shell: bash
        run: |
          set -euo pipefail
          sbom="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.spdx.json"
          "$RUNNER_TEMP/syft" scan "dir:." --output "spdx-json=$sbom"
          cd "$PUBLICATION_DIR"
          sha256sum "$(basename "$sbom")" | tee -a archive.sha256
        working-directory: ${{ github.workspace }}
      - name: Attest the catalog archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.tar.gz
          push-to-registry: false
          create-storage-record: false
      - name: Attest the SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.spdx.json
          predicate-type: https://spdx.dev/Document
          predicate-path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.spdx.json
          push-to-registry: false
          create-storage-record: false
      - name: Verify SBOM attestation provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          sbom="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.spdx.json"
          cp "$SBOM_ATTESTATION_BUNDLE" "$PUBLICATION_DIR/attestation-sbom.json"
          gh attestation verify "$sbom" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-catalog.yml" \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document \
            --deny-self-hosted-runners --format json \
            > "$PUBLICATION_DIR/verify-sbom.json" 2> "$PUBLICATION_DIR/verify-sbom.log"
      - name: Verify provenance and reject modified archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.tar.gz"
          cp "$ATTESTATION_BUNDLE" "$PUBLICATION_DIR/attestation.json"
          policy=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-catalog.yml"
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
            --deny-self-hosted-runners --format json)
          gh attestation verify "$archive" "${policy[@]}" \
            > "$PUBLICATION_DIR/verify-online.json" 2> "$PUBLICATION_DIR/verify-online.log"
          gh attestation trusted-root > "$PUBLICATION_DIR/trusted-root.jsonl" \
            2> "$PUBLICATION_DIR/trusted-root.log"
          offline=(--bundle "$PUBLICATION_DIR/attestation.json"
            --custom-trusted-root "$PUBLICATION_DIR/trusted-root.jsonl")
          gh attestation verify "$archive" "${policy[@]}" "${offline[@]}" \
            > "$PUBLICATION_DIR/verify-bundle.json" 2> "$PUBLICATION_DIR/verify-bundle.log"
          mkdir "$PUBLICATION_DIR/tampered"
          tampered="$PUBLICATION_DIR/tampered/$(basename "$archive")"
          cp "$archive" "$tampered"
          printf '\ncontrolled digest mismatch test\n' >> "$tampered"
          sha256sum "$archive" "$tampered" > "$PUBLICATION_DIR/tamper-digests.log"
          if gh attestation verify "$tampered" "${policy[@]}" "${offline[@]}" \
            > "$PUBLICATION_DIR/tamper-rejected.json" 2> "$PUBLICATION_DIR/tamper-rejected.log"; then
            echo 'ERROR: modified archive passed provenance verification' | tee -a "$PUBLICATION_DIR/tamper-rejected.log"
            exit 1
          else
            status=$?
            printf 'expected_verification_failure_exit=%s\n' "$status" | tee -a "$PUBLICATION_DIR/tamper-rejected.log"
            test "$status" -eq 1
          fi
          # Recheck the original with identical offline policy after the negative control.
          gh attestation verify "$archive" "${policy[@]}" "${offline[@]}" \
            > "$PUBLICATION_DIR/verify-after-tamper.json" 2> "$PUBLICATION_DIR/verify-after-tamper.log"
      - name: Upload the verified archive without a ZIP wrapper
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-agent-stack-${{ github.sha }}-archive
          path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Match the uploaded digest to the attested file
        env:
          UPLOADED_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          read -r expected _ < "$PUBLICATION_DIR/archive.sha256"
          printf 'expected_sha256=%s\nuploaded_sha256=%s\nartifact_id=%s\nartifact_url=%s\n' \
            "$expected" "$UPLOADED_DIGEST" "$ARTIFACT_ID" "$ARTIFACT_URL" | tee "$PUBLICATION_DIR/upload.log"
          test "$UPLOADED_DIGEST" = "$expected"
      - name: Upload the SBOM next to the archive
        id: sbom-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-agent-stack-${{ github.sha }}-sbom
          path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.spdx.json
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Match the uploaded SBOM digest to the attested file
        env:
          UPLOADED_DIGEST: ${{ steps.sbom-upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum "$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.spdx.json" | awk '{print $1}')"
          printf 'expected_sbom_sha256=%s\nuploaded_sbom_sha256=%s\n' \
            "$expected" "$UPLOADED_DIGEST" | tee "$PUBLICATION_DIR/sbom-upload.log"
          test "$UPLOADED_DIGEST" = "$expected"
      - name: Attest the public explorer
        id: attest-explorer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.explorer.html
          push-to-registry: false
          create-storage-record: false
      - name: Upload the public explorer next to the archive
        id: explorer-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-agent-stack-${{ github.sha }}-explorer
          path: ${{ runner.temp }}/catalog-publication/native-agent-stack-${{ github.sha }}.explorer.html
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Match the uploaded explorer digest to the attested file
        env:
          UPLOADED_DIGEST: ${{ steps.explorer-upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum "$PUBLICATION_DIR/native-agent-stack-${GITHUB_SHA}.explorer.html" | awk '{print $1}')"
          printf 'expected_explorer_sha256=%s\nuploaded_explorer_sha256=%s\n' \
            "$expected" "$UPLOADED_DIGEST" | tee "$PUBLICATION_DIR/explorer-upload.log"
          test "$UPLOADED_DIGEST" = "$expected"
      - name: Preserve publication success or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/catalog-publication/*.log
            ${{ runner.temp }}/catalog-publication/*.json
            ${{ runner.temp }}/catalog-publication/*.jsonl
            ${{ runner.temp }}/catalog-publication/*.sha256
          if-no-files-found: error
          retention-days: 7
