name: Suite shards trial, ubuntu-24.04 (draft pull request only)

# Second preregistered trial for the whole-suite test jobs (2026-10-03): run the existing unittest suite as
# concurrent single-process shards inside one job with GitHub's native parallel steps, beside the serial
# production command, on the runner of the required `validate` job (validate.yml: ubuntu-24.04, 4 vCPUs, the
# image's system python3). Record, rules and oracle: blueprints/convergence-practice/suite-shards-trial-20261003/
# (README.md, experiment.json, compare.py). It belongs to a DRAFT pull request that is never merged; none of its
# job names is a required context in .github/main-ruleset.json, and it changes no other workflow. Its macOS twin is
# suite-shards-trial-macos.yml, a separate workflow so that a stalled macOS queue never holds this evidence and
# either run can be cancelled alone.
#
# Parallel steps: github/docs content/actions/reference/workflows-and-actions/workflow-syntax.md at
# c67a9362ec63f3993d095bf70bd11724359cc50e, lines 1193-1224 (`parallel`: every step of the group is a background
# step, with an implicit wait at the end of the group) and 1078-1086 (at most 10 concurrent background steps; a
# failed background step fails the job at the wait that includes it). Every shard step exits with its unittest
# status, so a failing shard is expected to fail its step, the group and the job, as production would; the control
# job measures that each failing step fails on its own. No step inside a group has an `if:`, an expression in its
# script, a `uses:` or a GITHUB_ENV or GITHUB_PATH write.
#
# Trigger: only `opened` and `reopened` (events-that-trigger-workflows.md at 63859c48, lines 465 and 484-489), with
# a paths filter on this file, so pushing to the branch (synchronize) never re-runs the trial and the observed
# record can never land on this branch by accident.
#
# Repetition (preregistered, experiment.json quality_rule): the first workflow run whose compare result
# (compare_run_attempt 1) is adopt, reject or no verdict decides this OS; later runs are reported and cannot
# overturn it. A repeat is allowed only after a run that ended incomplete, by closing and reopening the pull request
# when no run of either trial workflow is in progress. Never re-run any job, the compare job included: compare.py
# makes the OS incomplete when its own GITHUB_RUN_ATTEMPT, or the run_attempt of any run or control directory, is
# not 1. Whether a re-run job's upload (overwrite: false) would fail on the first attempt's artifact name, and
# whether its data would reach a compare job, is unverified; the outcome is incomplete either way.
# cancel-in-progress is true: a reopen during a run cancels that run (incomplete, never a rule outcome) and starts
# one attended run, instead of queueing an unattended second run behind it.
#
# Jobs: inventory (the fail-closed parity and coverage gate, shard lists built at run time from the head);
# serial (arm S x 3) and shards (arms G4 and G4T x 3; at most 2 + 2 timed jobs at once); controls (a passing, a
# failing, a crashing and a hanging shard in one parallel group; expected to fail) and controls-check (asserts each
# step's own outcome); compare (the oracle's own tests, then compare.py; needs every job, runs always). Every job
# checks out the pull request head (a pull_request checkout is otherwise the merge commit) and asserts it.

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - .github/workflows/suite-shards-trial-linux.yml

permissions:
  contents: read

concurrency:
  group: suite-shards-trial-linux-${{ github.event.pull_request.number }}
  # github/docs data/reusables/actions/actions-group-concurrency.md at 336b7f54, line 11: true also cancels a run in
  # progress in this group. See "Repetition" above.
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIAL_DIR: blueprints/convergence-practice/suite-shards-trial-20261003
  OS_LABEL: ubuntu-24.04

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      - name: Check the interpreter (the image's system python3, CPython 3.12, as the validate job uses)
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -c 'import platform, sys; raise SystemExit(not (platform.python_implementation() == "CPython" and sys.version_info[:2] == (3, 12)))'
      - name: Build the inventory and the shard lists (fail-closed parity and coverage gate)
        run: >-
          python3 "$TRIAL_DIR/inventory.py" --os "$OS_LABEL" --root .
          --weights "$TRIAL_DIR/weights.json" --out "$RUNNER_TEMP/inventory"
      - name: Upload the inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventory
          path: ${{ runner.temp }}/inventory/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  serial:
    needs: inventory
    runs-on: ubuntu-24.04
    # validate allows 40 minutes for its whole job; the suite step below has its own hang guard.
    timeout-minutes: 75
    env:
      ARM: S
      REPEAT: ${{ matrix.repeat }}
      RUN_NAME: ubuntu-24.04-S-r${{ matrix.repeat }}
    strategy:
      fail-fast: false
      # With the shards job's 2, at most four timed jobs run at once.
      max-parallel: 2
      matrix:
        repeat: [1, 2, 3]
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, as validate: the suite resolves receipt revisions and the pinned release commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      - name: Check the interpreter (the image's system python3, CPython 3.12, as the validate job uses)
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -c 'import platform, sys; raise SystemExit(not (platform.python_implementation() == "CPython" and sys.version_info[:2] == (3, 12)))'
      # The four steps validate.yml runs before its suite (validate.yml at 9b0b8d6d, lines 55-60 and 139-217), with
      # their run bodies unchanged: the zizmor lock (its tests skip without zizmor), the promotion-gate venv and the
      # two npm pins (their tripwires fail any Actions job that is not a recorded gap).
      - name: Install checksum-locked CI analyzer
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --index-url https://pypi.org/simple
          -r .github/requirements-ci.txt
      - name: Provision the promotion gate's isolated venv
        env:
          UV_VERSION: '0.12.17'
          # https://github.com/astral-sh/uv/releases/download/0.12.17/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          UV_SHA256: fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/uv/archive.tar.gz"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/uv/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uv/archive.tar.gz" -C "$RUNNER_TEMP/uv" --strip-components=1
          "$RUNNER_TEMP/uv/uv" --version
          "$RUNNER_TEMP/uv/uv" venv --python /usr/bin/python3 "$RUNNER_TEMP/promotion-gate-venv"
          "$RUNNER_TEMP/uv/uv" pip sync --python "$RUNNER_TEMP/promotion-gate-venv/bin/python3" --require-hashes \
            blueprints/us-equities/data/requirements.lock
          echo "PROMOTION_GATE_PYTHON=$RUNNER_TEMP/promotion-gate-venv/bin/python3" >> "$GITHUB_ENV"
          echo "REQUIRE_PROMOTION_GATE_VENV=1" >> "$GITHUB_ENV"
      - name: Provision the pinned tree-sitter-bash parser for the token-measurement lane tests
        run: |
          python3 - <<'PYEOF'
          import json, os, shlex, string, subprocess

          with open("examples/claude-native/workflows/shell-parser.pin.json", encoding="utf-8") as handle:
              pin = json.load(handle)
          name = os.path.basename(pin["install"]["default_directory"])
          alphanumeric = string.ascii_letters + string.digits
          if not name or name[0] not in alphanumeric or any(char not in alphanumeric + "._-" for char in name):
              raise SystemExit("the pin names an install directory outside [A-Za-z0-9._-]")
          words = shlex.split(pin["install"]["command"])
          if words[:2] != ["npm", "install"] or words.count("<directory>") != 1:
              raise SystemExit("the pin's install command is not an npm install with one <directory>")
          directory = os.path.join(os.environ["RUNNER_TEMP"], name)
          os.makedirs(directory, exist_ok=True)
          subprocess.run([directory if word == "<directory>" else word for word in words], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("CHILD_USAGE_SHELL_PARSER=" + directory + "\n")
          PYEOF
      - name: Provision the pinned yaml package for the skills-modality SKILL.md reader tests
        run: |
          python3 - <<'PYEOF'
          import json, os, shlex, string, subprocess

          with open("tools/sota-convergence/landscape-sweep/skills-yaml.pin.json", encoding="utf-8") as handle:
              pin = json.load(handle)
          name = os.path.basename(pin["install"]["default_directory"])
          alphanumeric = string.ascii_letters + string.digits
          if not name or name[0] not in alphanumeric or any(char not in alphanumeric + "._-" for char in name):
              raise SystemExit("the pin names an install directory outside [A-Za-z0-9._-]")
          words = shlex.split(pin["install"]["command"])
          if words[:2] != ["npm", "install"] or words.count("<directory>") != 1:
              raise SystemExit("the pin's install command is not an npm install with one <directory>")
          directory = os.path.join(os.environ["RUNNER_TEMP"], name)
          os.makedirs(directory, exist_ok=True)
          subprocess.run([directory if word == "<directory>" else word for word in words], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("LANDSCAPE_SWEEP_SKILLS_YAML=" + directory + "\n")
          PYEOF
      - name: Prepare the run directory and record the runtime
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results/$RUN_NAME"
          mkdir -p "$out"
          python3 "$TRIAL_DIR/record.py" runtime "$out"
      - name: Record what a foreground step inherits (signal dispositions, interpreter, exported names)
        run: python3 "$TRIAL_DIR/record.py" probe "$RUNNER_TEMP/results/$RUN_NAME" foreground
      - name: Start the clock
        id: start
        run: python3 "$TRIAL_DIR/record.py" start "$RUNNER_TEMP/results/$RUN_NAME"
      - name: Run the whole suite serially (arm S, the production command with -v)
        timeout-minutes: 60
        run: |
          out="$RUNNER_TEMP/results/$RUN_NAME"
          printf '%s\n' "python3 -m unittest -v" > "$out/command.txt"
          status=0
          python3 -m unittest -v > "$out/log.txt" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/exit-code.txt"
          echo "arm S, repeat $REPEAT: exit $status"
          tail -n 3 "$out/log.txt"
          exit "$status"
      - name: Stop the clock and record the metadata and the checkout's status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          # The outcome of every step with an id (here the clock start): compare.py counts a run whose clock step did
          # not succeed as partial (a setup failure), never as ineligible.
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$TRIAL_DIR/record.py" finish "$RUNNER_TEMP/results/$RUN_NAME" --os "$OS_LABEL" --arm "$ARM" --repeat "$REPEAT"
      - name: Upload the arm-run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-ubuntu-24.04-S-r${{ matrix.repeat }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  shards:
    needs: inventory
    runs-on: ubuntu-24.04
    # Four shard steps of at most 25 minutes, a 15-minute tail and the setup fit well inside an hour.
    timeout-minutes: 60
    env:
      ARM: ${{ matrix.arm }}
      REPEAT: ${{ matrix.repeat }}
      RUN_NAME: ubuntu-24.04-${{ matrix.arm }}-r${{ matrix.repeat }}
    strategy:
      fail-fast: false
      # With the serial job's 2, at most four timed jobs run at once.
      max-parallel: 2
      matrix:
        # Repeat-major, the arm order alternating by repeat.
        include:
          - {repeat: 1, arm: G4}
          - {repeat: 1, arm: G4T}
          - {repeat: 2, arm: G4T}
          - {repeat: 2, arm: G4}
          - {repeat: 3, arm: G4}
          - {repeat: 3, arm: G4T}
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, as validate: the suite resolves receipt revisions and the pinned release commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      - name: Check the interpreter (the image's system python3, CPython 3.12, as the validate job uses)
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -c 'import platform, sys; raise SystemExit(not (platform.python_implementation() == "CPython" and sys.version_info[:2] == (3, 12)))'
      # The same four suite-environment steps as the serial job, from validate.yml, run bodies unchanged.
      - name: Install checksum-locked CI analyzer
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --index-url https://pypi.org/simple
          -r .github/requirements-ci.txt
      - name: Provision the promotion gate's isolated venv
        env:
          UV_VERSION: '0.12.17'
          # https://github.com/astral-sh/uv/releases/download/0.12.17/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          UV_SHA256: fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/uv/archive.tar.gz"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/uv/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uv/archive.tar.gz" -C "$RUNNER_TEMP/uv" --strip-components=1
          "$RUNNER_TEMP/uv/uv" --version
          "$RUNNER_TEMP/uv/uv" venv --python /usr/bin/python3 "$RUNNER_TEMP/promotion-gate-venv"
          "$RUNNER_TEMP/uv/uv" pip sync --python "$RUNNER_TEMP/promotion-gate-venv/bin/python3" --require-hashes \
            blueprints/us-equities/data/requirements.lock
          echo "PROMOTION_GATE_PYTHON=$RUNNER_TEMP/promotion-gate-venv/bin/python3" >> "$GITHUB_ENV"
          echo "REQUIRE_PROMOTION_GATE_VENV=1" >> "$GITHUB_ENV"
      - name: Provision the pinned tree-sitter-bash parser for the token-measurement lane tests
        run: |
          python3 - <<'PYEOF'
          import json, os, shlex, string, subprocess

          with open("examples/claude-native/workflows/shell-parser.pin.json", encoding="utf-8") as handle:
              pin = json.load(handle)
          name = os.path.basename(pin["install"]["default_directory"])
          alphanumeric = string.ascii_letters + string.digits
          if not name or name[0] not in alphanumeric or any(char not in alphanumeric + "._-" for char in name):
              raise SystemExit("the pin names an install directory outside [A-Za-z0-9._-]")
          words = shlex.split(pin["install"]["command"])
          if words[:2] != ["npm", "install"] or words.count("<directory>") != 1:
              raise SystemExit("the pin's install command is not an npm install with one <directory>")
          directory = os.path.join(os.environ["RUNNER_TEMP"], name)
          os.makedirs(directory, exist_ok=True)
          subprocess.run([directory if word == "<directory>" else word for word in words], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("CHILD_USAGE_SHELL_PARSER=" + directory + "\n")
          PYEOF
      - name: Provision the pinned yaml package for the skills-modality SKILL.md reader tests
        run: |
          python3 - <<'PYEOF'
          import json, os, shlex, string, subprocess

          with open("tools/sota-convergence/landscape-sweep/skills-yaml.pin.json", encoding="utf-8") as handle:
              pin = json.load(handle)
          name = os.path.basename(pin["install"]["default_directory"])
          alphanumeric = string.ascii_letters + string.digits
          if not name or name[0] not in alphanumeric or any(char not in alphanumeric + "._-" for char in name):
              raise SystemExit("the pin names an install directory outside [A-Za-z0-9._-]")
          words = shlex.split(pin["install"]["command"])
          if words[:2] != ["npm", "install"] or words.count("<directory>") != 1:
              raise SystemExit("the pin's install command is not an npm install with one <directory>")
          directory = os.path.join(os.environ["RUNNER_TEMP"], name)
          os.makedirs(directory, exist_ok=True)
          subprocess.run([directory if word == "<directory>" else word for word in words], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("LANDSCAPE_SWEEP_SKILLS_YAML=" + directory + "\n")
          PYEOF
      - name: Download the inventory (this arm's shard lists)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventory
          path: ${{ runner.temp }}/inventory
      - name: Prepare the run directory with this arm's lists and record the runtime
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results/$RUN_NAME"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/inventory/shards/$ARM/"shard-*.txt "$RUNNER_TEMP/inventory/shards/$ARM/tail.txt" "$out/"
          python3 "$TRIAL_DIR/record.py" runtime "$out"
      - name: Record what a foreground step inherits (signal dispositions, interpreter, exported names)
        run: python3 "$TRIAL_DIR/record.py" probe "$RUNNER_TEMP/results/$RUN_NAME" foreground
      - name: Start the clock
        id: start
        run: python3 "$TRIAL_DIR/record.py" start "$RUNNER_TEMP/results/$RUN_NAME"
      - parallel:
          - name: Shard 0
            timeout-minutes: 25
            env:
              SHARD: shard-0
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              python3 "$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: ${#modules[@]} modules, exit $status"
              exit "$status"
          - name: Shard 1
            timeout-minutes: 25
            env:
              SHARD: shard-1
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              python3 "$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: ${#modules[@]} modules, exit $status"
              exit "$status"
          - name: Shard 2
            timeout-minutes: 25
            env:
              SHARD: shard-2
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              python3 "$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: ${#modules[@]} modules, exit $status"
              exit "$status"
          - name: Shard 3
            timeout-minutes: 25
            env:
              SHARD: shard-3
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              python3 "$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: ${#modules[@]} modules, exit $status"
              exit "$status"
      - name: Serial tail (G4T only; the timing-bound module alone, after the group)
        if: ${{ !cancelled() && matrix.arm == 'G4T' && steps.start.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SHARD: tail
        run: |
          out="$RUNNER_TEMP/results/$RUN_NAME"
          python3 "$TRIAL_DIR/record.py" probe "$out" "$SHARD"
          modules=()
          while IFS= read -r module || [ -n "$module" ]; do
            if [ -n "$module" ]; then modules+=("$module"); fi
          done < "$out/$SHARD.txt"
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "$SHARD: empty module list" >&2
            exit 1
          fi
          printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
          status=0
          python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/$SHARD.exit"
          echo "$SHARD: ${#modules[@]} modules, exit $status"
          exit "$status"
      - name: Stop the clock and record the metadata and the checkout's status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          # The outcome of every step with an id (here the clock start): compare.py counts a run whose clock step did
          # not succeed as partial (a setup failure), never as ineligible.
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$TRIAL_DIR/record.py" finish "$RUNNER_TEMP/results/$RUN_NAME" --os "$OS_LABEL" --arm "$ARM" --repeat "$REPEAT"
      - name: Upload the arm-run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-ubuntu-24.04-${{ matrix.arm }}-r${{ matrix.repeat }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_NAME: ubuntu-24.04-controls
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      - name: Check the interpreter (the image's system python3, CPython 3.12, as the validate job uses)
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 -c 'import platform, sys; raise SystemExit(not (platform.python_implementation() == "CPython" and sys.version_info[:2] == (3, 12)))'
      - name: Copy the four control modules alone into an empty directory and export a probe variable
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results/$RUN_NAME"
          suite="$RUNNER_TEMP/control-suite"
          mkdir -p "$out" "$suite"
          cp "$TRIAL_DIR"/controls/test_ctl_pass.py "$TRIAL_DIR"/controls/test_ctl_fail.py \
            "$TRIAL_DIR"/controls/test_ctl_crash.py "$TRIAL_DIR"/controls/test_ctl_hang.py "$suite/"
          printf '%s\n' test_ctl_pass > "$out/shard-0.txt"
          printf '%s\n' test_ctl_fail > "$out/shard-1.txt"
          printf '%s\n' test_ctl_crash > "$out/shard-2.txt"
          printf '%s\n' test_ctl_hang > "$out/shard-3.txt"
          python3 "$TRIAL_DIR/record.py" runtime "$out"
          # compare.py requires every background shard to see this export from an earlier step.
          echo "SUITE_SHARDS_ENV_PROBE=1" >> "$GITHUB_ENV"
      - name: Record what a foreground step inherits (signal dispositions, interpreter, exported names)
        id: foreground
        run: python3 "$TRIAL_DIR/record.py" probe "$RUNNER_TEMP/results/$RUN_NAME" foreground
      # The production parallel structure on the controls: the arms' shard step body, run from the control
      # directory, each step with an id so the finish step records its own outcome. Expected: shard-0 exits 0 at
      # once; shard-3 is stopped by its 1-minute limit before it writes an exit status; shard-1 fails after 90 s and
      # shard-2 ends itself with os._exit(3) after 120 s, so both must outlive that stop and each other's failure;
      # steps success, failure, failure, failure; the group, and so the job, fails.
      - parallel:
          - name: Control shard 0 (passes)
            id: control-0
            timeout-minutes: 5
            env:
              SHARD: shard-0
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              cd "$RUNNER_TEMP/control-suite"
              python3 "$GITHUB_WORKSPACE/$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: exit $status"
              exit "$status"
          - name: Control shard 1 (one failing test, after 90 s)
            id: control-1
            timeout-minutes: 5
            env:
              SHARD: shard-1
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              cd "$RUNNER_TEMP/control-suite"
              python3 "$GITHUB_WORKSPACE/$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: exit $status"
              exit "$status"
          - name: Control shard 2 (the process ends itself with os._exit(3), after 120 s)
            id: control-2
            timeout-minutes: 5
            env:
              SHARD: shard-2
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              cd "$RUNNER_TEMP/control-suite"
              python3 "$GITHUB_WORKSPACE/$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: exit $status"
              exit "$status"
          - name: Control shard 3 (hangs; stopped by its 1-minute limit)
            id: control-3
            timeout-minutes: 1
            env:
              SHARD: shard-3
            run: |
              out="$RUNNER_TEMP/results/$RUN_NAME"
              cd "$RUNNER_TEMP/control-suite"
              python3 "$GITHUB_WORKSPACE/$TRIAL_DIR/record.py" probe "$out" "$SHARD"
              modules=()
              while IFS= read -r module || [ -n "$module" ]; do
                if [ -n "$module" ]; then modules+=("$module"); fi
              done < "$out/$SHARD.txt"
              if [ "${#modules[@]}" -eq 0 ]; then
                echo "$SHARD: empty module list" >&2
                exit 1
              fi
              printf '%s\n' "python3 -m unittest -v ${modules[*]}" > "$out/$SHARD.command"
              status=0
              python3 -m unittest -v "${modules[@]}" > "$out/$SHARD.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$SHARD.exit"
              echo "$SHARD: exit $status"
              exit "$status"
      - name: Record the metadata, each step's outcome, the hang control's heartbeat and the checkout's status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          # The outcome of every step with an id (the foreground probe and the four control steps), read after the
          # group's implicit wait.
          STEPS_JSON: ${{ toJSON(steps) }}
        run: >-
          python3 "$TRIAL_DIR/record.py" finish "$RUNNER_TEMP/results/$RUN_NAME" --os "$OS_LABEL" --arm controls
          --repeat 1 --heartbeat "$RUNNER_TEMP/control-suite/test_ctl_hang.heartbeat"
      - name: Upload the control run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controls
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  controls-check:
    needs: controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      # One artifact matches, so it is extracted into this path directly (download-artifact.ts at 3e5f45b2, lines
      # 186-195), which must then hold exactly the control run directory.
      - name: Download the control run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controls
          path: ${{ runner.temp }}/results/controls
      - name: Assert the control job failed and every control step behaved as preregistered
        env:
          CONTROLS_RESULT: ${{ needs.controls.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 "$TRIAL_DIR/compare.py" controls --artifact "$RUNNER_TEMP/results/controls"
          --os "$OS_LABEL" --job-result "$CONTROLS_RESULT" --expected-sha "$PR_HEAD_SHA"

  compare:
    needs: [inventory, serial, shards, controls, controls-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert the checkout is the pull request head, not a merge commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "checked out $actual, not the pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          echo "testing the pull request head $actual"
      # Pattern downloads: a missing artifact downloads nothing instead of failing the step
      # (actions/download-artifact src/download-artifact.ts at 3e5f45b2, lines 149-163 and 176-246), so compare.py
      # always runs and records a missing run directory as an incomplete run. The arm-runs are not merged: each
      # artifact lands in its own arm-<run name> directory (lines 186-195), and compare.py counts only the run
      # directory that artifact's name gives, so no job's files can pass as another run's.
      - name: Download the inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: inventory
          merge-multiple: true
          path: ${{ runner.temp }}/inventory
      - name: Download the arm-runs (one directory per artifact)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arm-*
          path: ${{ runner.temp }}/results
      - name: Download the control run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controls
          path: ${{ runner.temp }}/results/controls
      # An oracle that fails its own tests here writes no result.json: this step fails, compare.py does not run, and
      # the run decides nothing (README.md, "Which run decides").
      - name: Run the oracle's own tests on this interpreter (fail-closed)
        run: python3 -m unittest discover -s "$TRIAL_DIR" -p "test_*.py" -v
      - name: Keep the needs context (each job's result) for compare.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"
      # result.json (with this job's own run attempt), the exit files and the job results are the record; the step
      # summary below is a rendering of text the pull request controls, never the record.
      - name: Compare every run with the serial arm (compare.py)
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compare" "$RUNNER_TEMP/results" "$RUNNER_TEMP/inventory"
          python3 "$TRIAL_DIR/compare.py" verdict --results "$RUNNER_TEMP/results" \
            --inventory "$RUNNER_TEMP/inventory" --expected-sha "$PR_HEAD_SHA" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --os "$OS_LABEL" --needs "$RUNNER_TEMP/needs.json" --out "$RUNNER_TEMP/compare/result.json" \
            --summary-md "$RUNNER_TEMP/compare/summary.md" --checkout-status "$RUNNER_TEMP/compare/checkout-status.json"
          cat "$RUNNER_TEMP/compare/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare
          path: ${{ runner.temp }}/compare/
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
