name: OpenSSF Scorecard (report-only)

# Report-only supply-chain scorecard: publish_results is false (no publication
# to the public api.scorecard.dev dataset or badge), and no GitHub Advanced
# Security surface (Security tab / code-scanning alerts) is used. Results are
# retained only as a workflow artifact. See
# docs/decisions/2026-09-22-actions-hardening.md for the evidence and scope.

on:
  schedule:
    - cron: '13 5 * * 1' # Weekly Monday 05:13 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard (no publish, no Advanced Security)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results-${{ github.run_id }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 5
