name: Supply-chain SBOM and vulnerability scan (report-only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'blueprints/us-equities/supply-chain/**'
      - '.github/workflows/native-foundation-e2e.yml'
  pull_request:
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'blueprints/us-equities/supply-chain/**'
      - '.github/workflows/native-foundation-e2e.yml'
  schedule:
    - cron: '29 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom-vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Reproduce native-foundation-e2e.yml's pinned wheel download/verify/install into a venv
        run: |
          umask 022
          scan_root=$(mktemp --directory "$RUNNER_TEMP/supply-chain.XXXXXX")
          mkdir --mode=0755 -- "$scan_root/reports"
          printf 'SCAN_ROOT=%s\n' "$scan_root" >> "$GITHUB_ENV"
          output="$scan_root/reports"
          python3 -m venv "$scan_root/venv"
          python="$scan_root/venv/bin/python"
          packages=(nautilus_trader==2.0.0rc5 numpy==2.5.3 pandas==3.0.6 python-dateutil==2.9.0.post0 six==1.17.0)
          "$python" -m pip --isolated download --disable-pip-version-check --no-input \
            --index-url https://pypi.org/simple --only-binary=:all: --no-deps --pre \
            --dest "$scan_root/wheels" "${packages[@]}" \
            >"$output/download.stdout" 2>"$output/download.stderr"
          printf '%s  %s\n' eab45fafd2312deda1236554c49a9798bfc76bc8465af864878e2f70189ebebe \
            "$scan_root/wheels/nautilus_trader-2.0.0rc5-cp312-cp312-manylinux_2_34_x86_64.whl" \
            | sha256sum --check >"$output/engine-wheel-check.txt"
          sha256sum "$scan_root/wheels/"*.whl >"$output/downloaded-wheel-hashes.txt"
          "$python" -m pip --isolated install --disable-pip-version-check --no-input \
            --no-index --find-links "$scan_root/wheels" --no-deps --pre \
            "${packages[@]}" >"$output/install.stdout" 2>"$output/install.stderr"
          "$python" -m pip --isolated freeze >"$output/freeze.txt" 2>"$output/freeze.stderr"
          "$python" -m pip --isolated check >"$output/pip-check.stdout" 2>"$output/pip-check.stderr"
      - name: Install checksum-verified pinned syft
        env:
          SYFT_VERSION: '1.52.0'
          # https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_checksums.txt (fetched 2026-09-22)
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          mkdir -p "$RUNNER_TEMP/syft"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/syft/archive.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$RUNNER_TEMP/syft/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/syft/archive.tar.gz" -C "$RUNNER_TEMP/syft" syft
          "$RUNNER_TEMP/syft/syft" version
      - name: Install checksum-verified pinned grype
        env:
          GRYPE_VERSION: '0.119.0'
          # https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_checksums.txt (fetched 2026-09-22, latest release at that date)
          GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
        run: |
          mkdir -p "$RUNNER_TEMP/grype"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/grype/archive.tar.gz"
          printf '%s  %s\n' "$GRYPE_SHA256" "$RUNNER_TEMP/grype/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grype/archive.tar.gz" -C "$RUNNER_TEMP/grype" grype
          "$RUNNER_TEMP/grype/grype" version
      - name: Generate SBOM for the reproduced venv
        run: |
          mkdir -p "$SCAN_ROOT/sbom"
          "$RUNNER_TEMP/syft/syft" scan "dir:$SCAN_ROOT/venv" \
            -o "spdx-json=$SCAN_ROOT/sbom/venv.spdx.json" \
            -o "cyclonedx-json=$SCAN_ROOT/sbom/venv.cyclonedx.json"
      - name: Scan SBOM for known vulnerabilities (report-only)
        run: |
          "$RUNNER_TEMP/grype/grype" "sbom:$SCAN_ROOT/sbom/venv.spdx.json" \
            -o json > "$SCAN_ROOT/sbom/grype-findings.json"
          "$RUNNER_TEMP/grype/grype" db status > "$SCAN_ROOT/sbom/grype-db-status.txt"
      - name: Write scan summary
        run: |
          python3 - "$SCAN_ROOT" <<'PYEOF'
          import json, sys
          from pathlib import Path

          scan_root = Path(sys.argv[1])
          findings = json.loads((scan_root / "sbom/grype-findings.json").read_text())
          by_severity = {}
          for match in findings.get("matches", []):
              severity = (match.get("vulnerability") or {}).get("severity", "Unknown")
              by_severity[severity] = by_severity.get(severity, 0) + 1
          spdx = json.loads((scan_root / "sbom/venv.spdx.json").read_text())
          summary = {
              "syft_version": "1.52.0",
              "grype_version": "0.119.0",
              "grype_db_status": (scan_root / "sbom/grype-db-status.txt").read_text().strip(),
              "package_count": len(spdx.get("packages", [])),
              "findings_by_severity": by_severity,
              "note": "Report-only: no --fail-on threshold is applied by this job.",
          }
          (scan_root / "sbom/summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PYEOF
      - name: Upload SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.run_id }}
          path: |
            ${{ env.SCAN_ROOT }}/sbom/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
