name: Runtime-worker skills freshness (report-only)

on:
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:

# No token scope by default; each job grants its own (docs/decisions/2026-10-04-ci-least-privilege.md).
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          check-latest: false
      - name: Validate the runtime skills contract
        run: python3 -m unittest tests.test_install_skills tests.test_runtime_worker_skills
      - name: Report pins against upstream HEAD and native check semantics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/adoption/runtime_skill_freshness.py \
            --manifest blueprints/runtime-workers/skills/manifest.json \
            --output "$RUNNER_TEMP/runtime-skills/freshness.json" \
            --markdown "$RUNNER_TEMP/runtime-skills/freshness.md" --workers 4
      - name: Publish report summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/runtime-skills/freshness.md" ]; then
            cat "$RUNNER_TEMP/runtime-skills/freshness.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain report including unknown or failed fetches
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-worker-skills-freshness-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-skills/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
