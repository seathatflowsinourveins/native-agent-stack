name: Dependency review (warn-only)

# Warn-only PR dependency review, not added to required status checks (see
# docs/decisions/2026-09-22-actions-hardening.md). This job calls GitHub's
# dependency-graph/diff API rather than downloading and executing binaries or
# packages, so it does not need a harden-runner step under this decision's
# scope (validate, supply-chain, publish-catalog, catalog-freshness and
# adoption-bootstrap's linux job).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes (report-only; never blocks the PR)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: true
