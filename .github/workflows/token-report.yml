name: Validate portable token report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test portable lifetime accounting
        run: python3 -m unittest discover -s tools/token-report -p test_token_manifest.py -q
