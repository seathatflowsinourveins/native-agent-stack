name: Validate published evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check example workflow byte identity
        run: |
          cd examples/claude-native/workflows
          sha256sum --check --strict SHA256SUMS
      - name: Install checksum-locked CI analyzer
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --index-url https://pypi.org/simple
          -r .github/requirements-ci.lock
      - name: Audit GitHub workflows without network or credentials
        run: zizmor --offline --no-config --no-ignores --persona regular --strict-collection .github/workflows
      - name: Check workflow syntax and expressions with pinned upstream actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint/archive.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Validate manifests and evidence integrity
        run: python3 scripts/validate.py
      - name: Validate catalog evidence and coverage joins
        run: python3 scripts/validate_catalogs.py
      - name: Validate general foundation capability claims
        run: python3 scripts/validate_foundation.py --root . --json
      - name: Validate landscape choices and alternative evidence
        run: python3 scripts/landscape.py --root .
      - name: Reproduce independent source-report accounting
        run: python3 blueprints/blind-catalog-convergence/audit_reports.py --check
      - name: Validate declared convergence evidence and scope
        run: >-
          python3 scripts/validate_convergence.py
          --all-recorded --root . --json
      - name: Check layer-verdict generator output is current
        run: python3 tools/sota-convergence/build_verdicts.py --check
      - name: Check offline ecosystem explorer rebuild
        run: python3 scripts/build_ecosystem.py --check
      - name: Test validation failure modes
        run: python3 -m unittest
      - name: Test semantic evidence contract boundaries
        run: node --test blueprints/native-skill-practice/test-contract.cjs

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified pinned gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          # blueprints/convergence-practice/wsl-native-tools/pins.json, components[name=gitleaks].archive.sha256
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan git history for secrets
        if: always()
        run: |
          # --config: reviewed allowlists (.gitleaks.toml); --max-target-megabytes 2: the
          # generated explorer HTML is skipped (recorded as incomplete coverage in
          # docs/github-automation.md); measured 2026-09-22: 522 commits, 777 MB, 34 s locally.
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --max-target-megabytes 2 \
            --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks/gitleaks.json"
      - name: Scan working tree for secrets
        if: always()
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --max-target-megabytes 2 --redact --no-banner
      - name: Upload redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
