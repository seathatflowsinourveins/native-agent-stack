name: Validate published evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Was 5 minutes with a fetch-depth: 1 checkout; raised to cover the added full-history
    # clone (the secret-scan job's comment below records ~34s locally for the same clone).
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
        # Full history (not the default fetch-depth: 1) is required so that
        # `python3 scripts/host_receipts.py validate`'s `git cat-file -e
        # <catalog_revision>^{commit}` check can actually resolve a receipt's
        # recorded catalog_revision when it is an earlier commit than HEAD.
      - name: Check example workflow byte identity
        run: |
          cd examples/claude-native/workflows
          sha256sum --check --strict SHA256SUMS
      - name: Install checksum-locked CI analyzer
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --index-url https://pypi.org/simple
          -r .github/requirements-ci.lock
      - name: Audit GitHub workflows without network or credentials
        run: zizmor --offline --no-config --no-ignores --persona regular --strict-collection .github/workflows
      - name: Check workflow syntax and expressions with pinned upstream actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint/archive.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Validate manifests and evidence integrity
        run: python3 scripts/validate.py
      - name: Validate host evidence contribution receipts
        run: python3 scripts/host_receipts.py validate
      - name: Report release-due new-machine paths (strict only on a re-pin)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/release_due.py --strict-if-repinned "origin/${BASE_REF:-main}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate catalog evidence and coverage joins
        run: python3 scripts/validate_catalogs.py
      - name: Validate general foundation capability claims
        run: python3 scripts/validate_foundation.py --root . --json
      - name: Validate landscape choices and alternative evidence
        run: python3 scripts/landscape.py --root .
      - name: Reproduce independent source-report accounting
        run: python3 blueprints/blind-catalog-convergence/audit_reports.py --check
      - name: Validate declared convergence evidence and scope
        run: >-
          python3 scripts/validate_convergence.py
          --all-recorded --root . --json
      - name: Check layer-verdict generator output is current
        run: python3 tools/sota-convergence/build_verdicts.py --check
      - name: Check per-component independent-review and E2E matrix is current
        run: python3 scripts/component_matrix.py --check
      - name: Check the new-host grand list is current
        run: python3 scripts/new_host_grand_list.py --check
      - name: Check offline ecosystem explorer rebuild
        run: python3 scripts/build_ecosystem.py --check
      - name: Provision the promotion gate's isolated venv
        env:
          UV_VERSION: '0.12.17'
          # https://github.com/astral-sh/uv/releases/download/0.12.17/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          UV_SHA256: fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/uv/archive.tar.gz"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/uv/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uv/archive.tar.gz" -C "$RUNNER_TEMP/uv" --strip-components=1
          "$RUNNER_TEMP/uv/uv" --version
          "$RUNNER_TEMP/uv/uv" venv --python /usr/bin/python3 "$RUNNER_TEMP/promotion-gate-venv"
          "$RUNNER_TEMP/uv/uv" pip sync --python "$RUNNER_TEMP/promotion-gate-venv/bin/python3" --require-hashes \
            blueprints/us-equities/data/requirements.lock
          echo "PROMOTION_GATE_PYTHON=$RUNNER_TEMP/promotion-gate-venv/bin/python3" >> "$GITHUB_ENV"
          echo "REQUIRE_PROMOTION_GATE_VENV=1" >> "$GITHUB_ENV"
      - name: Test validation failure modes
        run: python3 -m unittest
      - name: Test semantic evidence contract boundaries
        run: node --test blueprints/native-skill-practice/test-contract.cjs

  verdict-review-gate:
    # Required check (docs/decisions/2026-09-22-github-automation-closure.md, "verdict-review-gate
    # (2026-09-23)"): with one maintainer and zero required approvals, a PR that changes a
    # layer-verdict row merges only with the sealed cross-family review its wave records. It has
    # no path filter so it reports on every pull request and can be required.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
        # Full history: the gate reads the base commit's ledger and wave registry with git show.
      - name: Require sealed cross-family review for changed verdict rows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Cross-check only: the base is the checked-out merge commit's first parent.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The pushed range's previous commit on main.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              # actions/checkout checks out the PR merge commit; its first parent is the base-branch
              # commit the PR is merged into, which is what the gate must compare with.
              first_parent="$(git rev-parse --verify --quiet 'HEAD^1^{commit}' || true)"
              payload="${PR_BASE_SHA:-}"
              if [ -n "$first_parent" ] && [ -n "$payload" ]; then
                if ! git merge-base --is-ancestor "$payload" "$first_parent"; then
                  echo "::error::verdict-review-gate: the payload base $payload is not an ancestor of the merge commit's first parent $first_parent"
                  exit 1
                fi
                base="$first_parent"
              elif [ -n "$first_parent" ]; then
                base="$first_parent"
              elif [ -n "$payload" ]; then
                base="$payload"
              else
                echo "::error::verdict-review-gate: neither the merge commit's first parent nor the payload base is available"
                exit 1
              fi
              ;;
            push)
              base="${PUSH_BEFORE_SHA:-}"
              # A branch-creating push has an all-zero before: there is no base to judge against.
              if [ -z "$base" ] || [ -z "${base//0/}" ]; then
                echo "::error::verdict-review-gate: the push has no previous commit (before is '$base'); failing closed"
                exit 1
              fi
              ;;
            *)
              # workflow_dispatch has no base in its payload: compare with the parent.
              base="$(git rev-parse --verify 'HEAD^1^{commit}')"
              ;;
          esac
          # The rules come from the base: run the base commit's gate (and the code it imports) against
          # this checkout, so a pull request cannot weaken the gate that judges it. Only the pull
          # request that adds the gate finds none at its base and runs its own copy.
          gate="scripts/verdict_review_gate.py"
          if git cat-file -e "$base:$gate" 2>/dev/null; then
            git worktree add --quiet --detach "$RUNNER_TEMP/gate-base" "$base"
            gate="$RUNNER_TEMP/gate-base/$gate"
          else
            echo "verdict-review-gate: the base has no gate yet; running this checkout's copy (bootstrap)"
          fi
          python3 "$gate" --root "$GITHUB_WORKSPACE" --base "$base" | tee -a "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified pinned gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          # blueprints/convergence-practice/wsl-native-tools/pins.json, components[name=gitleaks].archive.sha256
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan git history for secrets
        if: always()
        run: |
          # --config: reviewed allowlists (.gitleaks.toml); --max-target-megabytes 2: the
          # generated explorer HTML is skipped (recorded as incomplete coverage in
          # docs/github-automation.md); measured 2026-09-22: 522 commits, 777 MB, 34 s locally.
          # --log-opts=HEAD: scan what this run would land (a pull request's merge commit, or
          # main on push). The default is every fetched ref, so one open branch's finding
          # failed every other pull request (2026-09-23: #116's branch failed #117).
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --max-target-megabytes 2 \
            --log-opts="HEAD" \
            --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks/gitleaks.json"
      - name: Scan working tree for secrets
        if: always()
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --max-target-megabytes 2 --redact --no-banner
      - name: Upload redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
