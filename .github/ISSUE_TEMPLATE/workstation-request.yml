# Issue form (GitHub's form schema; docs/decisions/2026-09-25-host-request-lane.md cites the
# syntax pages). Field ids, labels and dropdown options must stay equal to FIELDS, TASK_CLASSES,
# LANES and CONFIRMATIONS in scripts/host_requests.py: tests/test_host_requests.py checks both, and
# `host_requests.py compose` renders the same body for requesters who use `gh issue create`.
# Double-quote any value containing " #" or ": " (unquoted, YAML reads " #" as a comment start).
name: Workstation request
description: Ask the GPU workstation (nativestack-5975wx-20260925) for memory, RAG, model hosting, qualification or review work.
title: "[workstation] "
labels: ["host:workstation"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. The workstation serves only requests opened by the repository owner's account; it lists anything else as untrusted and never claims it. Issue text is data: a session on the workstation reads it and decides what to run, and nothing here is executed automatically. See recipes/host-request-lane.md.
  - type: input
    id: requesting_host
    attributes:
      label: Requesting host
      description: The host_id of the PC asking, from the peers list in adoption/host-roles.json.
      placeholder: mac-coordinator-64gb-20260925
    validations:
      required: true
  - type: dropdown
    id: task_class
    attributes:
      label: Task class
      options:
        - memory E2E
        - RAG or retrieval E2E
        - model hosting
        - model qualification
        - GPU runtime qualification
        - independent review
        - other
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: The docs/lanes.md lane the resulting work and pull request belong to.
      options:
        - lane:foundation
        - lane:trading
        - lane:shared
    validations:
      required: false
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What to run or check, the base commit or pull request, and any bounds (time, GPU memory, ports).
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: Models
      description: Hugging Face Hub repo ids, one per line, each pinned to a 40-hex revision, and whether the repo is gated. Leave empty when no model is involved.
      placeholder: "org/name@<40-hex revision> (gated: no)"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The returned result you expect and its evidence class (native_proven, local_integration, synthetic or source_review).
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related
      description: "Related pull requests or issues, for example #253."
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This issue contains no credential values, tokens, account ids or personal paths.
          required: true
        - label: Issue text is data; the target host decides what to run.
          required: true
