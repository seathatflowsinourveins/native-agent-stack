# OSV-Scanner configuration for .github/workflows/security-scan.yml, passed with
# --config so it applies to every lockfile in .github/osv-scanner-lockfiles.json.
#
# Ignore policy: an [[IgnoredVulns]] entry needs `id`, a concrete `reason` and an
# `ignoreUntil` date at most 90 days after it is added; an expired entry stops
# applying and the scan fails again. tests/test_osv_lockfile_coverage.py enforces
# the fields and the 90-day bound. Each entry is also listed, with its evidence,
# in docs/decisions/2026-09-22-github-automation-closure.md.
#
# No entry as of 2026-09-22: with --no-resolve the base-commit scan found only the
# six tools/mlx-smoke/requirements.lock.txt advisories (mlx 0.29.3, transformers
# 5.0.0rc1), which are fixed by relocking, not ignored.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-21
# reason = "Why the vulnerable code is unreachable here, with the evidence path."

# Every ignore below matches by id in every scanned lockfile (repo-wide). An inventory lock may pin a version one of
# them hides only where IGNORE_ALLOWED_LOCKS in tests/test_osv_lockfile_coverage.py lists that advisory for that
# lock, with the reviewed lock's sha256 and the path of its non-reachability evidence; the test fails on any other
# affected pin (it follows includes and fails closed on a version or line it cannot parse strictly), on an include
# in an allowed lock, on any change to an allowed lock and, from an ignore's ignoreUntil date, on an allowed lock
# that still lists that advisory.
[[IgnoredVulns]]
id = "GHSA-8mgp-746c-j5xp"
ignoreUntil = 2026-12-24
reason = "nltk through 3.10.3: TransitionParser.train/parse, AveragedPerceptron.save/load, PerceptronTagger.save_to_json and nltk.classify.maxent.save_maxent_params open caller-chosen model paths with the built-in open() instead of the pathsec helpers (the advisory's comparison case is the guarded PerceptronTagger.load_from_json, which in 3.10.3 still authorizes a caller-chosen private model directory), so untrusted input that chooses a model import or export path can read or write outside the allowed roots; pathsec enforcement is on by default (ENFORCE = True in nltk/pathsec.py of 3.10.3). No patched release as of 2026-09-27; the fixes are merged on develop (nltk #3757, #3759, #3813). Each lock allowed to pin nltk is named, with its reviewed sha256 and non-reachability evidence, in IGNORE_ALLOWED_LOCKS in tests/test_osv_lockfile_coverage.py. Lumibot lock: nltk 3.10.3 is a transitive pin (google-adk, llama-index-core) of the evaluation-only Lumibot 4.6.1 environment, run offline under bwrap, and no trial code calls these APIs (evidence: blueprints/us-equities/engine-trials/spy-one-zero-20260926/repository-checks.json). Expiry plan: relock every allowed lock onto the first nltk release that ships those fixes, then delete this ignore; delete the Lumibot lock unless a verdict has adopted Lumibot."

[[IgnoredVulns]]
id = "GHSA-h35f-9h28-mq5c"
ignoreUntil = 2026-12-24
reason = "setuptools 80.10.2 in the same frozen evaluation-only lock, run offline under bwrap; the advisory needs an sdist build on macOS APFS/HFS+, while this environment was installed binary-only on Linux (--no-build) and its one source build used setuptools 84.0.0; relocking would change the recorded environment. At expiry, delete the Lumibot lock and these ignores unless Lumibot has been adopted by a verdict. Evidence: blueprints/us-equities/engine-trials/spy-one-zero-20260926/repository-checks.json"

# The next two (2026-09-29) cover two allowed locks: the live OpenHands recipe lock
# (blueprints/runtime-workers/openhands/requirements.lock) until its relock onto oauthlib 4.0.0, and the frozen
# Lumibot lock above. Their short expiry follows the live lock; on 2026-10-13 the scan fails again on the Lumibot
# lock by design. The PyJWT ignore of the same day ended on 2026-09-30 with the OpenHands relock onto PyJWT 2.14.0.
[[IgnoredVulns]]
id = "GHSA-hj66-6f7g-4r5v"
ignoreUntil = 2026-10-13
reason = "oauthlib 0.6.1 through 3.3.1 (fixed in 4.0.0): RevocationEndpoint wraps its response in the request's callback parameter only when constructed with enable_jsonp=True (oauthlib/oauth2/rfc6749/endpoints/revocation.py:72-73 and 81-82 in 3.3.1); oauthlib's pre-configured servers never pass it. Two allowed locks pin 3.3.1: the OpenHands recipe lock and the frozen, evaluation-only Lumibot lock (run offline under bwrap). A text search of every hash-verified artifact of both locks found no enable_jsonp or create_revocation_response and no importer of oauthlib's endpoints, grant types or servers: oauthlib is imported only by requests-oauthlib 2.0.0 (client classes, token errors and helpers) and, in the Lumibot lock, kubernetes 36.0.3 (an exception class); every other RevocationEndpoint is Authlib's own class, and Authlib does not import oauthlib. Evidence: evidence/receipts/osv-oauthlib-pyjwt-reachability-20260929.json and, for the OpenHands lock at its relocked sha256, evidence/receipts/osv-openhands-pyjwt-relock-20260930.json. Expiry plan: the OpenHands lock was relocked onto PyJWT 2.14.0 on 2026-09-30 and still pins oauthlib 3.3.1; oauthlib 4.0.0 (PyPI, 2026-09-28T06:01Z) is inside the 7-day window the upstream workspace's exclude-newer applies, so its owner relocks onto it after 2026-10-05T06:01Z and, in the same change, deletes the OpenHands entry of IGNORE_ALLOWED_LOCKS, whose sha256 pin fails any change to that lock. The Lumibot lock stays frozen on 3.3.1, so on 2026-10-13 renew this ignore for that lock alone with a new dated reason, or delete that lock."

[[IgnoredVulns]]
id = "GHSA-xpv3-w29h-x7cv"
ignoreUntil = 2026-10-13
reason = "oauthlib >= 3.0.0, < 4.0.0 (fixed in 4.0.0; the scanned locks pin 3.3.1): an oauthlib authorization server compares the PKCE code_verifier with == (code_challenge_method_s256 at oauthlib/oauth2/rfc6749/grant_types/authorization_code.py:49 and code_challenge_method_plain at :61, in 3.3.1), called only from AuthorizationCodeGrant.validate_token_request (line 506) when a token endpoint handles a request. Neither allowed lock (the OpenHands recipe lock and the frozen Lumibot lock) runs an oauthlib authorization server: in a text search of every hash-verified artifact of both locks, oauthlib is imported only by requests-oauthlib 2.0.0 (WebApplicationClient, LegacyApplicationClient, the oauth1 Client, token errors and helpers) and, in the Lumibot lock, kubernetes 36.0.3 (an exception class), and nothing imports oauthlib's grant types, endpoints or servers; the PKCE code in openhands-sdk, requests-oauthlib and google-auth-oauthlib only generates a verifier as a client. Evidence: evidence/receipts/osv-oauthlib-pyjwt-reachability-20260929.json and, for the OpenHands lock at its relocked sha256, evidence/receipts/osv-openhands-pyjwt-relock-20260930.json. Expiry plan: as for GHSA-hj66-6f7g-4r5v; the OpenHands relock onto oauthlib 4.0.0 removes that lock's pin, and on 2026-10-13 this ignore is renewed for the frozen Lumibot lock alone or that lock is deleted."
