# OSV-Scanner configuration for .github/workflows/security-scan.yml, passed with
# --config so it applies to every lockfile in .github/osv-scanner-lockfiles.json.
#
# Ignore policy: an [[IgnoredVulns]] entry needs `id`, a concrete `reason` and an
# `ignoreUntil` date at most 90 days after it is added; an expired entry stops
# applying and the scan fails again. tests/test_osv_lockfile_coverage.py enforces
# the fields and the 90-day bound. Each entry is also listed, with its evidence,
# in docs/decisions/2026-09-22-github-automation-closure.md.
#
# No entry as of 2026-09-22: with --no-resolve the base-commit scan found only the
# six tools/mlx-smoke/requirements.lock.txt advisories (mlx 0.29.3, transformers
# 5.0.0rc1), which are fixed by relocking, not ignored.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-21
# reason = "Why the vulnerable code is unreachable here, with the evidence path."

# These two ignores match by id in every scanned lockfile (repo-wide). An inventory lock may pin a version one of
# them hides only where IGNORE_ALLOWED_LOCKS in tests/test_osv_lockfile_coverage.py lists that advisory for that
# lock, with the reviewed lock's sha256 and the path of its non-reachability evidence; the test fails on any other
# affected pin (it follows includes and fails closed on a version or line it cannot parse strictly), on an include
# in an allowed lock, on any change to an allowed lock and, from an ignore's ignoreUntil date, on an allowed lock
# that still lists that advisory.
[[IgnoredVulns]]
id = "GHSA-8mgp-746c-j5xp"
ignoreUntil = 2026-12-24
reason = "nltk through 3.10.3: TransitionParser.train/parse, AveragedPerceptron.save/load, PerceptronTagger.save_to_json and nltk.classify.maxent.save_maxent_params open caller-chosen model paths with the built-in open() instead of the pathsec helpers (the advisory's comparison case is the guarded PerceptronTagger.load_from_json, which in 3.10.3 still authorizes a caller-chosen private model directory), so untrusted input that chooses a model import or export path can read or write outside the allowed roots; pathsec enforcement is on by default (ENFORCE = True in nltk/pathsec.py of 3.10.3). No patched release as of 2026-09-27; the fixes are merged on develop (nltk #3757, #3759, #3813). Each lock allowed to pin nltk is named, with its reviewed sha256 and non-reachability evidence, in IGNORE_ALLOWED_LOCKS in tests/test_osv_lockfile_coverage.py. Lumibot lock: nltk 3.10.3 is a transitive pin (google-adk, llama-index-core) of the evaluation-only Lumibot 4.6.1 environment, run offline under bwrap, and no trial code calls these APIs (evidence: blueprints/us-equities/engine-trials/spy-one-zero-20260926/repository-checks.json). Expiry plan: relock every allowed lock onto the first nltk release that ships those fixes, then delete this ignore; delete the Lumibot lock unless a verdict has adopted Lumibot."

[[IgnoredVulns]]
id = "GHSA-h35f-9h28-mq5c"
ignoreUntil = 2026-12-24
reason = "setuptools 80.10.2 in the same frozen evaluation-only lock, run offline under bwrap; the advisory needs an sdist build on macOS APFS/HFS+, while this environment was installed binary-only on Linux (--no-build) and its one source build used setuptools 84.0.0; relocking would change the recorded environment. At expiry, delete the Lumibot lock and these ignores unless Lumibot has been adopted by a verdict. Evidence: blueprints/us-equities/engine-trials/spy-one-zero-20260926/repository-checks.json"
