version: 2
# Version updates: github-actions only (weekly, 7-day cooldown). Security updates for
# every manifest in the dependency graph are a repository setting (on since
# 2026-09-22); pip version updates for the hash-locked, cutoff-reproducible locks stay
# off (docs/decisions/2026-09-22-github-automation-closure.md, section 8).
# The pip entry below exists only to keep security-update PRs off the deliberately
# vulnerable grype positive-control fixture: `ignore` also applies to security
# updates, and open-pull-requests-limit: 0 disables its version updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    # Minimum release age before a version-update PR opens (Dependabot's cooldown
    # option; security updates are exempt). Matches agent-lab's setting.
    cooldown:
      default-days: 7
  # Deliberately vulnerable positive-control fixture (urllib3 1.26.4, gap
  # ci-supply-chain[13], tests/test_grype_known_cve_fixture.py). `ignore` also
  # applies to security updates (exclude-paths and the PR limit do not), so no
  # PR bumps the pin; alerts still appear and are dismissed as not_used.
  - package-ecosystem: pip
    directory: /blueprints/gap-wave2-20260923/grype-known-cve-fixture
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: urllib3
