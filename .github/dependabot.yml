version: 2
# Version updates: github-actions only (weekly, 7-day cooldown). Security updates for
# every manifest in the dependency graph are a repository setting (on since
# 2026-09-22); pip version updates for the hash-locked, cutoff-reproducible locks stay
# off (docs/decisions/2026-09-22-github-automation-closure.md, section 8).
# The grype positive-control fixture at blueprints/gap-wave2-20260923/grype-known-cve-fixture
# is named requirements.txt.fixture (not requirements.txt), so Dependabot's pip manifest
# discovery never finds it there and needs no dedicated pip entry or ignore rule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    # Minimum release age before a version-update PR opens (Dependabot's cooldown
    # option; security updates are exempt). Matches agent-lab's setting.
    cooldown:
      default-days: 7
