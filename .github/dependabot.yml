version: 2
# github-actions version updates, plus one pip entry below scoped to a
# deliberately vulnerable fixture: `ignore: urllib3` suppresses
# security-update PRs for that pin (exclude-paths and the PR limit apply only
# to version updates, not security updates), and open-pull-requests-limit: 0
# also keeps version-update PRs off. Alerts still come from the dependency
# graph regardless of this file and are dismissed as not_used
# (tests/test_grype_known_cve_fixture.py). Security updates for the real pip
# lock files are a repository setting (on since 2026-09-22), not a
# version-update entry here; pip version updates for those locks stay off
# (docs/decisions/2026-09-22-github-automation-closure.md).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    # Minimum release age before a version-update PR opens (Dependabot's cooldown
    # option; security updates are exempt). Matches agent-lab's setting.
    cooldown:
      default-days: 7
  # Deliberately vulnerable positive-control fixture (urllib3 1.26.4, gap
  # ci-supply-chain[13], tests/test_grype_known_cve_fixture.py). `ignore` also
  # applies to security updates (exclude-paths and the PR limit do not), so no
  # PR bumps the pin; alerts still appear and are dismissed as not_used.
  - package-ecosystem: pip
    directory: /blueprints/gap-wave2-20260923/grype-known-cve-fixture
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: urllib3
