version: 2
# Version updates: github-actions only (weekly, 7-day cooldown). Security updates for
# every manifest in the dependency graph are a repository setting (on since
# 2026-09-22); pip version updates for the hash-locked, cutoff-reproducible locks stay
# off (docs/decisions/2026-09-22-github-automation-closure.md, section 8).
# The CI analyzer lock is .github/requirements-ci.txt (renamed from requirements-ci.lock
# on 2026-09-25) so the dependency graph can list zizmor and security updates can cover it
# (post-merge SBOM check in section 8). No pip version-update entry is added: a zizmor
# security-update PR fails the pin test and the evidence hash check by design, and the
# maintainer does the reviewed relock and closes it, as with #97/#98 -> #99.
# npm/pnpm and uv: the only manifests (blueprints/convergence-practice/application-delivery,
# blueprints/convergence-practice/wsl-retrieval, evidence/artifacts/macos-application-20260924/variant)
# are frozen experiment or evidence artifacts whose lock hashes are registered in
# manifests/evidence.json and cited by receipts, so a version bump would break validate;
# application-delivery also pins pnpm 12, outside the pnpm versions Dependabot lists.
# NuGet: the 23 packages.lock.json files are overlays for an upstream LEAN checkout with
# no project file; neither Dependabot nor the dependency graph discovers them, and
# security-scan.yml's osv-scanner job is their only vulnerability-alert path.
# Overturn for both: section 8, "Ecosystems without a version-update entry (2026-09-25)".
# The grype positive-control fixture at blueprints/gap-wave2-20260923/grype-known-cve-fixture
# is named requirements.txt.fixture (not requirements.txt), so Dependabot's pip manifest
# discovery never finds it there and needs no dedicated pip entry or ignore rule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    # Minimum release age before a version-update PR opens (Dependabot's cooldown
    # option; security updates are exempt). Matches agent-lab's setting.
    cooldown:
      default-days: 7
