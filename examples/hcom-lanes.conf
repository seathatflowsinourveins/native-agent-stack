# hcom lane tabs on the private -L hcom server (CC orchestration round 2, 2026-10-06).
# tmux defaults kept: detach-on-destroy on, set-titles off (the tab keeps hcom's --title), remain-on-exit off, exit-empty on.
set -g prefix None
set -g destroy-unattached on
set -ga update-environment WSL_INTEROP
set -ga update-environment WT_SESSION
set -ga update-environment WT_PROFILE_ID
set -ga update-environment WSLENV
set -g allow-passthrough on
set -g status off
set -g history-limit 50000
