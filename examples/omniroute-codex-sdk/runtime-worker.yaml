# Dagu 2.18.2 / 5ca5c59f6b67734c9f0ae186bd59f5e0bb5846f4.
# Native graph/run/depends/timeout format from examples/embedded/local/workflow.yaml
# and the existing blueprints/convergence-practice/job-recovery/run.py recipe.
# Export only the task-specific path bindings described in enhancements.md.
type: graph
timeout_sec: 720
max_active_runs: 1
env:
  - STACK_ROOT: ${STACK_ROOT}
  - WORKER_PROJECT: ${WORKER_PROJECT}
  - WORKER_CODEX_HOME: ${WORKER_CODEX_HOME}
  - WORKER_BASE_URL: ${WORKER_BASE_URL}
  - WORKER_RESULT: ${WORKER_RESULT}
  - WORKER_TASK_FILE: ${WORKER_TASK_FILE}
steps:
  - id: readiness
    run: >-
      rtk proxy uv run --locked --script "${STACK_ROOT}/examples/omniroute-codex-sdk/worker.py"
      --workspace "${WORKER_PROJECT}" --codex-home "${WORKER_CODEX_HOME}"
      --base-url "${WORKER_BASE_URL}"
      --preflight --require-mcp context-mode --timeout 60
    # Task configuration: add --require-skill NAME to readiness only after
    # installing and verifying that selected skill through enhancements.md.
  - id: worker
    depends: [readiness]
    run: >-
      rtk proxy uv run --locked --script "${STACK_ROOT}/examples/omniroute-codex-sdk/worker.py"
      --workspace "${WORKER_PROJECT}" --codex-home "${WORKER_CODEX_HOME}"
      --base-url "${WORKER_BASE_URL}"
      --sandbox read-only --timeout 600 --prompt -
      --native-result "${WORKER_RESULT}" < "${WORKER_TASK_FILE}"
