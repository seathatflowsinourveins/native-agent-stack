# Codex custom-agent carrier for the token-efficiency E2E (2026-09-29), discovered user-wide from
# $CODEX_HOME/agents/ with no [agents.<name>] table (examples/codex-native/README.md, 2026-09-29 section).
# At openai/codex rust-v0.157.1 (36650394) a role file changes only the overrides listed at
# codex-rs/core/src/agent/role.rs:36-48 (developer_instructions, model, reasoning effort and a few others),
# never the sandbox, MCP servers, tool lists or web_search: read-only access and the verifier's no-web
