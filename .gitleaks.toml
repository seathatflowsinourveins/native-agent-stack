# Upstream configuration: https://github.com/gitleaks/gitleaks#configuration
# Keep all default detection. Every allowlist below is scoped under a specific
# `[[rules]] id = "..."` block (NOT a top-level `[[allowlists]]`) and is BOTH
# path-restricted (an exact file path, not a whole directory) AND context-restricted
# (a specific field-name/value shape, not a bare hex-secret pattern).
#
# This replaces an earlier revision that used two problems at once:
#   1. A top-level `regexTarget = "secret"` allowlist for bare 64-hex/40-hex values,
#      with no `paths` restriction, so it suppressed ANY matching hex-shaped secret
#      anywhere in the repo (e.g. a synthetic `api_key = "<64-hex>"` line).
#   2. A top-level `[[allowlists]]` with BOTH `paths` and `regexes` set. Measured
#      against the installed gitleaks 8.30.1 binary (not just its upstream source),
#      a top-level allowlist with `paths` set skips the ENTIRE FILE once the path
#      matches, regardless of whether any `regexes` also given ever match (verified
#      with a `paths`-matching, deliberately non-matching-`regexes` allowlist: the
#      file was still skipped with 0 bytes scanned). Only a `[[rules.allowlists]]`
#      block nested under a specific `[[rules]] id = "..."` was measured to apply
#      `paths` and `regexes` as a true per-line AND: the same non-matching-regex
#      allowlist, moved under a rule, left the file's real secret detected, and a
#      matching key-name regex suppressed only that exact key/value shape while a
#      `ghp_`-shaped token on the very same line, or an `api_key`/`token` field in a
#      non-allowlisted path, was still caught. Every allowlist below is therefore
#      rule-scoped for this reason, duplicated under both rules that produced
#      matches (generic-api-key, sourcegraph-access-token) where relevant.
#      Regression coverage for both failure modes is in tests/test_gitleaks_config.py.
#
# 2026-09-22 baseline: a full-history scan with default rules (`.gitleaks.toml`
# moved aside) over 525 commits (~801 MB scanned) produced 257 findings across 27
# files (234 generic-api-key + 23 sourcegraph-access-token; the sourcegraph rule
# matched a subset of the same 40-hex values already caught by generic-api-key).
# All 257 were classified by shape and location before allowlisting:
#   - 3 recorded QuantConnect.Api build-artifact hashes (2026-09-20, unchanged below).
#   - Content digests (40/64-hex SHA-1/SHA-256) that are JSON values under a closed
#     set of ~70 named fields (archive_sha256, source_head_pin, commit, disk-token,
#     etc. - the exact list is in the semantic-fields allowlist below), restricted to
#     the 25 exact evidence/blueprint/catalog files that produced them.
#   - Content digests under filename-shaped JSON keys (a source-tree or build-output
#     path such as "engine.go" or "scripts/native_token_ci.py") in whole-file or
#     whole-subtree checksum manifests, restricted to the same 25 exact files and to
#     keys that look like a relative path (contain "." or "/", or are one of a small
#     set of known extension-less filenames) so a credential-shaped key such as
#     "api_key" or "token" is never matched by this allowlist even inside those files.
#   - Git commit/tree ids referenced in two dated review narratives: no longer
#     handled by an in-config allowlist (see the note below the codex-review-64
#     paragraph); the reviewed real lines are exempted individually via exact
#     fingerprint in the root .gitleaksignore file instead.
#   - Opaque Alpaca pagination cursors ("next_page_token") in one retained
#     historical-bars receipt, restricted to that exact file, keyed on the literal
#     "next_page_token" field, and anchored to the whole line.
#   - sha256sum-style "<64-hex>  <filename>" lines inside a JSON string array in two
#     sealed comparison-protocol files, restricted to those two exact files.
#
# 2026-09-22, Codex cross-family review fix round (codex-review-64): every
# `regexTarget = "line"` regex below is now anchored to the WHOLE line
# (`^\s*...,?\s*$`), not just a substring match anywhere on it. An unanchored
# `regexTarget = "line"` allowlist exempts the ENTIRE line once its pattern matches
# anywhere on it -- so a line holding both an allowed digest ("sha256": "<64-hex>")
# AND an unrelated secret ("api_key": "<64-hex>") on the same physical line was
# exempted for both, not just the digest. The `next_page_token` cursor exemption
# was also changed from `regexTarget = "secret"` (matching only the value's
# base64-with-padding shape, anywhere, under no key constraint beyond the path) to
# a keyed, line-anchored `regexTarget = "line"` regex requiring the literal
# `"next_page_token"` field name, so an unrelated `api_key` value of the same shape
# is not incidentally exempted. Regression coverage for both fixes is in
# tests/test_gitleaks_config.py.
#
# 2026-09-22, the prose-narrative commit-id allowlist that previously lived
# here (an in-config regex under generic-api-key/sourcegraph-access-token,
# restricted to the two blind-catalog-convergence review files) was removed
# after four review rounds (the Opus evidence review of this branch, not
# codex-review-72; a blind Codex cross-family review of PR #83; a blind
# Opus/Codex evidence review of that fix; and a final blind Codex review,
# codex-review-83b) each found it leaky in a new way that RE2 (gitleaks'
# regex engine, which has no lookaround or backreferences) cannot close with
# a regex fix alone -- most recently, its context-word separator could
# itself absorb leading hex characters, and a non-hex-shaped secret sharing
# the same JSON string as a real commit reference remained exempted in full
# regardless of how the marker/hex grammar was tightened. The two review
# files' real narrative lines are now exempted individually by exact
# `commit:path:rule:line` fingerprint in the root .gitleaksignore file
# (gitleaks' own mechanism for known historical false positives, read from
# that file by default); a later commit changing a matching line gets a new
# fingerprint and is still detected. See .gitleaksignore's header comment for
# the full rationale, the generation commands, and the rule that fingerprints
# are added only for reviewed false positives, never for real secrets.
#
# After this config (and the root .gitleaksignore, which gitleaks reads by
# default), `gitleaks git . --config .gitleaks.toml --max-target-megabytes 2`
# restricted to this branch's own ancestry (--log-opts="HEAD") scanned 409
# commits (~1.03 GB) and produced 0 findings (re-measured 2026-09-22,
# codex-review-83b fix round, after replacing the prose-narrative regex
# allowlist with .gitleaksignore fingerprints; `git merge-base --is-ancestor`
# confirms every commit scanned this way is an ancestor of this branch's HEAD).
# Before adding .gitleaksignore, the same command against a scratch copy of
# this config with both narrative-allowlist blocks simply removed (no
# replacement) produced 15 findings / 14 unique fingerprints, all in the two
# review-narrative files the removed allowlist covered; `gitleaks dir .`
# against that same scratch config produced 0 findings, confirming the
# allowlist removal did not surface any finding outside those two files
# before .gitleaksignore was added to re-suppress them individually. The
# default-log-opts (all-refs) count and any out-of-ancestry sibling-branch
# finding reported by an earlier revision of this comment were NOT re-measured
# in this fix round: this is a shared repository with other active branches,
# so a rerun on a different day can see a different count; only the
# HEAD-scoped 0-findings result above is this unit's own acceptance evidence,
# and reaching 0 on the default (all-refs) command may still require either
# `--log-opts="HEAD"` or another branch's own fix -- unchanged from before,
# and still a coordinator decision, not resolved by this unit.
# Resolved 2026-09-23 by the coordinator: CI's secret-scan job now passes
# --log-opts="HEAD", scanning the ancestry of what the run would land (a pull
# request's merge commit, or main on push). The all-refs default had let
# open PR #116's branch fail PR #117's required check; each branch is still
# scanned by its own pull request's run.
#
# Before the whole-line-anchoring fix above, the same `--log-opts="HEAD"` command
# (anchored to a single line only, pre-fix) additionally flagged two corpus_files
# entries in protocol-C.json and protocol.sealed.json (lines 98-99 each) because
# the underlying generic-api-key rule's own match for those array entries spans
# TWO adjacent lines; the corpus_files allowlist regex was widened (see its own
# comment above) to match one-or-more consecutive corpus_files-shaped lines, which
# resolved both without reverting to an unanchored match.
#
# `--exit-code 0` tells gitleaks to always return process exit code 0, findings
# or not (it does NOT mean "0 findings required"); pass/fail must be read from
# the "leaks found: N" / "no leaks found" log line or the JSON report, never
# from the process exit code, when this flag is used. tests/test_gitleaks_config.py
# test_exit_code_zero_flag_always_returns_zero_even_with_findings pins this
# behavior against the installed binary so a wrongly-recorded exit code (as
# happened once during this unit's review) cannot recur unnoticed.
#
# validate.yml's secret-scan job passes --config .gitleaks.toml and
# --max-target-megabytes 2. Since 2026-09-23 (see docs/decisions/2026-09-23-
# generated-explorer-sorted-manifest.md), docs/ecosystem/index.html is generated by
# scripts/build_ecosystem.py --write and is no longer committed, so the current
# working tree and every future commit no longer carry that 12+ MB file: `gitleaks
# dir .` scans the full current tree with no size-based skip needed for it, and a
# `gitleaks git .` scan of new commits going forward has nothing generated to skip
# either. The `--max-target-megabytes 2` flag is kept as a general guard against any
# other oversized file, and remains a genuine, separately recorded coverage hole for
# every EXISTING historical commit that still carries the old committed
# docs/ecosystem/index.html in git history (`gitleaks git .` walks that history and
# still skips those large blobs at their old committed size); it is not a hole for
# the current tree or for any new commit.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact recorded hashes for the three QuantConnect.Api build artifacts"
condition = "AND"
paths = ['''^blueprints/us-equities/execution-realism/inputs\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.dll": "52b34a1b463455b353e3e3c1a5eb73073423b4566fb33f7b048e4915375c3780",?\s*$''',
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.pdb": "283f667f1519a38887e94d25b9f2d421575cb93c114c3aa3afe709dc3d96521c",?\s*$''',
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.xml": "828ef6359e33844b81ca839238ffac8f2dcd10995c5629cb40956bf5d4853e5c",?\s*$'''
]

# Content digests held under a closed set of named JSON fields (sha256/commit/pin
# style keys), restricted to the exact files that were reviewed and produced them.
[[rules.allowlists]]
description = "Content digests (40/64-hex) under named sha256/commit/pin fields in reviewed evidence files"
condition = "AND"
paths = [
  '''^blueprints/convergence-practice/offhost-restore/source-receipt\.json$''',
  '''^blueprints/convergence-practice/service-reboot/attempt-1/freeze\.json$''',
  '''^blueprints/convergence-practice/service-reboot/attempt-2/freeze\.json$''',
  '''^blueprints/convergence-practice/service-reboot/attempt-2/guest-after\.json$''',
  '''^blueprints/convergence-practice/service-reboot/attempt-2/guest-before\.json$''',
  '''^blueprints/us-equities/broad-universe/receipt\.json$''',
  '''^blueprints/us-equities/execution-realism/inputs\.json$''',
  '''^catalogs/landscape/claude-independent-discovery\.json$''',
  '''^evidence/artifacts/catalog-clean-install-20260921/source-manifest\.json$''',
  '''^evidence/artifacts/executed-comparisons-20260922/executed-comparisons/executed-comparisons/durable-memory/protocol-C\.json$''',
  '''^evidence/artifacts/executed-comparisons-20260922/executed-comparisons/executed-comparisons/durable-memory/protocol\.sealed\.json$''',
  '''^evidence/artifacts/full-stack-convergence-20260921/native-token-workflow\.json$''',
  '''^evidence/artifacts/native-dagu-retry-20260920/source-after\.json$''',
  '''^evidence/artifacts/native-dagu-retry-20260920/source-before\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/freeze\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/guest-after\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/guest-before\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/guest-freeze\.json$''',
  '''^evidence/artifacts/portable-userspace-install-20260921/token-clean-install-unprivileged/receipt\.json$''',
  '''^evidence/artifacts/portable-userspace-install-20260921/token-clean-install/receipt\.json$''',
  '''^evidence/receipts/native-dashboard-access-20260921\.json$''',
  '''^evidence/receipts/native-token-ci-github-20260920\.json$''',
  '''^evidence/receipts/native-token-ci-local-20260920\.json$''',
  '''^evidence/receipts/native-token-clean-prefix-20260920\.json$''',
  '''^evidence/receipts/portable-userspace-install-20260921\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"(?:after_neutral_key_manifest_sha256|archive_sha256|arms_json_sha256|artifact_archive_sha256|artifact_sha256|base_commit|before_neutral_key_manifest_sha256|binary_sha256_before|binary_sha256|cases_sealed_sha256|checkpoint_sha256|claim_sha256|commit|completed_sha256|config_sha256|content_sha256|corporate_actions_ledger|corpus_sha256sums|coverage_manifest|coverage_probes|dagu_archive_sha256|dagu|daily_parquet|dataset_ledger|derived_sha256|disk-token|disk_token|downloaded_receipt_sha256|entitlement_probe|evaluate_sha256|evaluated_at_commit|evaluation_events|expected_symbol_sha256|frozen_commit|head_sha|image_sha256|input_sha256|installed_binary_sha256|interpreter_sha256|ledger_sha256|machine_id_sha256|manifest_sha256|openapi_sha256|payload_iso_sha256|plan_sha256|preparation_receipt_sha256|private_original_sha256|python_sha256|qemu_binary_sha256|raw_sha256|recovered_sha256|refetch_check|response_sha256|result_sha256|retained_sha256|rtk_archive_sha256|runner_sha256|scan_private|seal_sha256|seed_sha256|sha256|source_head_pin|source_revision|source_sha256|stderr_raw_sha256|stderr_sha256|stdout_raw_sha256|stdout_sha256|symbols_sha256|ubuntu_keyring_sha256|uv_executable_sha256|workflow_sha256)":\s*"(?:[0-9a-f]{40}|[0-9a-f]{64})",?\s*$''',
]

# Content digests under filename-shaped JSON keys (whole-file or whole-subtree
# checksum manifests: a source-tree inventory or a small build/script hash map).
# The key alternative requires a path separator, a file extension, a leading dot,
# or one of a few known extension-less filenames, so a credential-shaped key name
# (api_key, token, secret, password, ...) is never matched by this allowlist even
# inside these exact files.
[[rules.allowlists]]
description = "Content digests (40/64-hex) under filename-shaped keys in reviewed checksum-manifest files"
condition = "AND"
paths = [
  '''^blueprints/convergence-practice/service-reboot/attempt-1/freeze\.json$''',
  '''^blueprints/convergence-practice/service-reboot/attempt-2/freeze\.json$''',
  '''^blueprints/us-equities/execution-realism/inputs\.json$''',
  '''^evidence/artifacts/catalog-clean-install-20260921/source-manifest\.json$''',
  '''^evidence/artifacts/full-stack-convergence-20260921/native-token-workflow\.json$''',
  '''^evidence/artifacts/native-dagu-retry-20260920/source-after\.json$''',
  '''^evidence/artifacts/native-dagu-retry-20260920/source-before\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/freeze\.json$''',
  '''^evidence/artifacts/native-service-reboot-20260920/guest-freeze\.json$''',
  '''^evidence/artifacts/portable-userspace-install-20260921/token-clean-install-unprivileged/receipt\.json$''',
  '''^evidence/artifacts/portable-userspace-install-20260921/token-clean-install/receipt\.json$''',
  '''^evidence/receipts/native-token-ci-github-20260920\.json$''',
  '''^evidence/receipts/native-token-ci-local-20260920\.json$''',
  '''^evidence/receipts/native-token-clean-prefix-20260920\.json$''',
  '''^evidence/receipts/portable-userspace-install-20260921\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"(?:[A-Za-z0-9_$][A-Za-z0-9_\-./$]*[./][A-Za-z0-9_\-.$]*|\.[A-Za-z0-9_\-./$]+|Dockerfile|LICENSE|Makefile|SHA256SUMS)":\s*"(?:[0-9a-f]{40}|[0-9a-f]{64})",?\s*$''',
]

# 2026-09-24 (round-7 tightening, Codex "not ready" on the shared allowlist above):
# blueprints/us-equities/adaptive-paper/source-hashes.json maps engine/test file paths
# under this module (several path-shaped keys contain "credential", e.g.
# credential_guard.py) to their sha256, which the shared filename-shaped-key allowlist
# above would also have suppressed for a real hex secret under a credential-shaped key
# such as "credential.key" in this same file (that allowlist's key alternative accepts
# any filename-shaped key, not only a real repo path). This dedicated, rule-scoped
# allowlist instead requires the ENTIRE key to be a repo path specifically under
# blueprints/us-equities/adaptive-paper/ or tests/, ending in .py, .json, .sh, or .txt, mapped to
# exactly 64 lowercase hex -- scripts/validate.py and
# tests/test_adaptive_paper_source_hashes_manifest.py independently enforce that every
# entry in this exact file really is that path's own sha256 and that no other keys
# exist, so a secret can never sit in this manifest without failing CI's validate job
# regardless of this allowlist. A credential-shaped key (api_key, credential.key, ...)
# in this same file, a non-hex value, a second secret on the same line, or this same
# path-keyed shape in any other file, is still detected (tests/test_gitleaks_config.py).
[[rules.allowlists]]
description = "Content digests (64-hex) under adaptive-paper/tests repo-path keys in the pinned source-hashes manifest"
condition = "AND"
paths = ['''^blueprints/us-equities/adaptive-paper/source-hashes\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"(?:blueprints/us-equities/adaptive-paper|tests)/[A-Za-z0-9_\-./]+\.(?:py|json|sh|txt)":\s*"[0-9a-f]{64}",?\s*$''',
]

# Opaque Alpaca pagination cursor retained in one historical-bars receipt. Anchored
# to the WHOLE line and keyed on the literal "next_page_token" field name (not just
# the cursor's base64-with-padding shape): an earlier revision used
# `regexTarget = "secret"` matching only that shape, which would also exempt an
# unrelated `api_key`/token value of the same shape anywhere in this path, even on
# a different key. This form requires the exact `"next_page_token": "<value>"` line
# with nothing else on it, so any other credential-shaped value sharing this line
# (or this base64 shape under a different key) is still detected.
[[rules.allowlists]]
description = "next_page_token cursor, keyed and line-anchored"
condition = "AND"
paths = ['''^blueprints/us-equities/broad-universe/receipt\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"next_page_token":\s*"[A-Za-z0-9+/]{16,}={1,2}"\s*,?\s*$''',
]

# sha256sum-style "<64-hex>  <filename>" lines inside a JSON string array, restricted
# to the two sealed-protocol files that record them.
#
# The base generic-api-key rule's own match for these array entries can span TWO
# adjacent array-entry lines at once (its separator context tolerates the newline
# between one entry's trailing comma and the next entry's opening quote), so the
# text gitleaks evaluates this `regexTarget = "line"` allowlist against can itself
# be that two-line span, not always a single physical line (re-measured 2026-09-22,
# codex-review-64 fix round: `gitleaks git . --log-opts=HEAD` flagged exactly this
# shape at protocol-C.json:98-99 and protocol.sealed.json:98-99 once the allowlist
# below was anchored to a single line only). The regex is therefore anchored to ONE
# OR MORE consecutive lines that are EACH individually shaped exactly like a
# corpus_files entry, with nothing else on any of them -- still rejecting a line
# that mixes a real entry with any unrelated key/value pair, since `[^"]+` cannot
# cross the double-quote that would introduce one.
[[rules.allowlists]]
description = "sha256sum-style corpus_files entries in sealed comparison protocols"
condition = "AND"
paths = [
  '''^evidence/artifacts/executed-comparisons-20260922/executed-comparisons/executed-comparisons/durable-memory/protocol-C\.json$''',
  '''^evidence/artifacts/executed-comparisons-20260922/executed-comparisons/executed-comparisons/durable-memory/protocol\.sealed\.json$''',
]
regexTarget = "line"
regexes = [
  '''^(?:\s*"[0-9a-f]{64}\s{2}[^"]+",?\s*\n?)+$''',
]

# 2026-09-23 (PR #116, ai-memory scheduled learning evidence): the report's
# learning.report.aggregate.repeated_rejection_fingerprints[].key values are ai-memory's
# rejection_fingerprint, hex_sha256 over a rejection record's normalized target/kind/operation/
# edit_mode/reason/summary (akitaonrails/ai-memory crates/ai-memory-store/src/auto_improve.rs), i.e.
# content digests the generic-api-key rule reads as a "key" credential. Exempted: that exact file,
# this rule only, and only a whole anchored "key" line holding one of the 4 reviewed digests (pinned
# by value, like the QuantConnect entry above, so a later 64-hex value under "key" is still caught);
# an api_key/token field, another "key" value, or the same lines in any other file are still detected
# (tests/test_gitleaks_config.py test_e/test_e2).
[[rules.allowlists]]
description = "ai-memory rejection fingerprints (SHA-256) under \"key\" in the scheduled-learning evidence"
condition = "AND"
paths = [
  '''^observability/memory-scheduled-20260923\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"key":\s*"(?:ab60ca6b319cd1ae67edf7153a82dfe740358d9fe839f8e52366edfa88cf38db|ad141246c92c80672c10dba83896fe6744fc0ef5ef3a4d3ca07b27fce89aa9b0|125b939f93f32338ee87c4fe362dbc1e10237865266014573628ca6ab7d811a1|683cc56662967628cbce607d2a76a95e81eab811bf0033a167885cc243e399b9)",?\s*$''',
]

[[rules]]
id = "sourcegraph-access-token"

# 2026-09-23 (landscape-sweep lane, PR #153): catalogs/sota-convergence/manifest-20260923.json
# gained lane text that names Sourcegraph (the SCIP index format's former sourcegraph/scip home and
# its announcement URL). The rule's keyword then makes every 40-hex value in the file a candidate,
# and 5 existing component pins matched: "pin": "<40-hex>" and "pin": "<version> @ <40-hex>", git
# commit ids that the generator copies from the catalog layer files. Exempted: that exact file,
# this rule only, and only a whole anchored "pin" line whose value is a 40-hex id with an optional
# "<version> @ " prefix; any other field holding a 40-hex value in the same file is still detected
# (tests/test_gitleaks_config.py test_d/test_d2).
[[rules.allowlists]]
description = "Git commit ids under the \"pin\" field of the dated SOTA manifest"
condition = "AND"
paths = [
  '''^catalogs/sota-convergence/manifest-20260923\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"pin":\s*"(?:[0-9A-Za-z.+_-]+ @ )?[0-9a-f]{40}",?\s*$''',
]

# Same named-field allowlist as generic-api-key above (source_head_pin and friends
