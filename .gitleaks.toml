# Upstream configuration: https://github.com/gitleaks/gitleaks#configuration
# Keep all default detection. Allowlists cover reviewed non-credential matches only:
# (1) three recorded QuantConnect.Api build-artifact hashes (2026-09-20);
# (2) content digests (64-hex SHA-256, 40-hex SHA-1/git ids) in evidence artifacts and
#     receipts, and opaque Alpaca pagination cursors ("next_page_token") in a retained
#     historical-bars receipt (2026-09-22: the only matches a full-history scan produced,
#     251 findings over 522 commits, all classified by shape before allowlisting).
# validate.yml's secret-scan job passes --config .gitleaks.toml and
# --max-target-megabytes 2; the generated explorer HTML is therefore NOT scanned and that
# is recorded as incomplete coverage (its sources are scanned).
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact recorded hashes for the three QuantConnect.Api build artifacts"
condition = "AND"
paths = ['''^blueprints/us-equities/execution-realism/inputs\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.dll": "52b34a1b463455b353e3e3c1a5eb73073423b4566fb33f7b048e4915375c3780",?\s*$''',
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.pdb": "283f667f1519a38887e94d25b9f2d421575cb93c114c3aa3afe709dc3d96521c",?\s*$''',
  '''^\s*"Launcher/bin/Debug/QuantConnect\.Api\.xml": "828ef6359e33844b81ca839238ffac8f2dcd10995c5629cb40956bf5d4853e5c",?\s*$'''
]

[[allowlists]]
description = "Content digests: 64-hex SHA-256 and 40-hex SHA-1/git object ids are not secrets"
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{64}$''',
  '''^[0-9a-f]{40}$''',
]

[[allowlists]]
description = "Opaque market-data pagination cursors retained in historical receipts"
regexTarget = "line"
regexes = [
  '''"next_page_token":\s*"[A-Za-z0-9+/=_-]{20,}"''',
]
