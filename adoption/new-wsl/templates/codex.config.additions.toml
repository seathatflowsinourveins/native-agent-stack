# The new WSL distribution's additions to adoption/templates/codex.config.template.toml. Only
# tools/adoption/new_wsl_client_config.py reads this file: it merges it into the shared template (a key both files define
# is refused) and wires each piece through adoption/new-wsl/client-config-map.json like any template piece. The shared
# template stays what every other host renders (tools/adoption/render_config.py, the bootstrap's full profile), so
# nothing here reaches another host. Placeholders are the host values of the render; XDG_RUNTIME_DIR is the systemd user
# runtime directory of the user the tool runs as, /run/user/<uid> (user@.service(5): user-runtime-dir@UID.service
# creates /run/user/UID; pam_systemd(8) sets $XDG_RUNTIME_DIR to it, systemd 255), which the tool fills from that
# user's id.

# Standard tier: the user chose "Normal, fast on demand (Recommended)" at 2026-10-05T13:22:24Z.
# Explicit "default" forces the standard tier. Unset uses the TUI catalog's default_service_tier, which is "priority"
# for gpt-6-sol and gpt-6-luna (openai/codex rust-v0.160.0, codex-rs/models-manager/models.json:512,680;
# codex-rs/tui/src/service_tier_resolution.rs:35-42). /fast toggles and persists config.toml: "fast" on, "default" off
# (codex-rs/tui/src/chatwidget/service_tiers.rs:47-56; codex-rs/tui/src/config_update.rs:105-121 at the same tag).
# For one run, use -c service_tier=priority: Codex 0.161.0 reads legacy "fast" as the same tier and sends it as "priority"
# (codex-rs/protocol/src/config_types.rs L542 and L549 at rust-v0.161.0). See
# docs/decisions/2026-10-04-new-wsl-changelog-parity.md's 2026-10-05 amendment.
service_tier = "default"

# Codex 0.161.0 offers its tool-suggestion tool only while the tool_suggest, apps and plugins features are all on
# (codex-rs/core/src/tools/spec_plan.rs L657-662 at rust-v0.161.0); with tool_suggest off the model's tool list does not
# carry it. This table merges key by key with the shared template's [features].
[features]
tool_suggest = false

# ai-memory, the memory slot's interim install (definitive manifest, amendment 3): its tools carry no MCP annotations, so
# under approval_policy = "never" Codex refuses every call unless the approval mode approves it (codex-rs/core/src/
# mcp_tool_call.rs at rust-v0.160.0). The new distribution's standing requirement is no permission prompts (wave-2
# memory ruling, change 13). The map classes the key authorization, so this tool writes it only with
# --with-authorization-settings and only while the memory slot installs ai-memory. ai-memory 3.1.0's own setup, which the
# install plan's memory-owner row runs, writes the same key unconditionally, whatever this tool was given: install-mcp
# --client codex sets default_tools_approval_mode = "approve" on every write of this table
# (akitaonrails/ai-memory@11ca7c5b crates/ai-memory-cli/src/commands/install_mcp.rs:1923, in 1909-1932; setup.rs:960-981).
# That is recorded and accepted (the CC's ruling G1, 2026-10-17): it matches the host's approval_policy = "never"
# posture, and nothing strips the key afterwards, because a second writer of it would break the one-writer rule (D1).
[mcp_servers.ai-memory]
default_tools_approval_mode = "approve"
# The server requires its root bearer (init writes auth-tokens/default and [auth] bearer_token_file), and Codex names
# the variable that holds it, as ai-memory 3.1.0's own setup writes for Codex when the token lives in that file
# (install_mcp.rs:106-136, 173-202 and 1924-1925 at 11ca7c5b; docs/install.md:637-649): the name only, never the
# token. Codex takes an MCP bearer only from an environment variable it names: it reads the variable from its own
# process environment and refuses an unset or empty one (openai/codex@83086188 codex-rs/codex-mcp/src/rmcp_client.rs:
# 877-905; streamable_http only, mcp_types.rs:382-386 and 489-495), which is why the token is an environment variable.
# On NativeHorizonNY the host launcher ~/.local/bin/codex-lane exports it from ai-memory's owner-only token file before
# it runs codex (the CC's ruling D4; host state, outside this repository); Codex's other load path is $CODEX_HOME/.env
# (codex-rs/arg0/src/lib.rs:268-288). The shells' inherit = "none" keeps it from them. Recorded residual (the CC's
# ruling G2, 2026-10-17), traced in source, not measured: the variable reaches every hook process of that Codex session,
# because Codex snapshots its whole environment (codex-rs/hooks/src/registry.rs:79) and replays it into each hook
# command, filtering only its own NON_INHERITABLE_ENV_VARS (codex-rs/hooks/src/engine/command_runner.rs:424-436;
# codex-rs/protocol/src/shell_environment.rs:15-22). That stays inside the same user's trust boundary, for a
# loopback-only service whose token file is already owner-only; the export must stay out of every global environment
# (shell profile, user manager), so only a codex-lane session carries it. ai-memory's own hooks read the token persisted
# under their data dir (install_hooks.rs:676-754 at 11ca7c5b), not this variable.
bearer_token_env_var = "AI_MEMORY_AUTH_TOKEN"

# semble 0.6.1 (MinishLab/semble, a uv tool), the code-search slot's interim install (definitive manifest, amendment 3;
# wave-2 code-search ruling, changes 2-5). Stdio, CPU only, no port. Its two tools carry no MCP annotations, so Codex
# 0.160.0 asks before each call unless the approval mode approves them (authorization, as above); enabled_tools names
# them. SEMBLE_MODEL_NAME is the local snapshot of the pinned model (minishlab/potion-code-16M-v2 at e9d2a44c), and
# SEMBLE_CACHE_LOCATION is this client's own absolute cache (Claude Code's is semble-claude): a cache shared by two
# processes can keep serving an index another process rebuilt.
[mcp_servers.semble]
command = "semble"
enabled_tools = ["search", "find_related"]
default_tools_approval_mode = "approve"

[mcp_servers.semble.env]
SEMBLE_MODEL_NAME = "${HOME}/.local/share/semble/potion-code-16M-v2-e9d2a44c"
SEMBLE_CACHE_LOCATION = "${HOME}/.cache/semble-codex"

# Shells start from an empty environment plus the set table (the shared template's PATH and two telemetry switches, and
# the variables below), so no credential or broker variable of the launcher reaches them (docs/secret-storage.md, Codex;
# the one Codex-side measure credential_status.py --client-guards checks; wave-2 custody ruling, change 7). Codex adds
# its own variables, CODEX_THREAD_ID among them, after this step (codex-rs/protocol/src/shell_environment.rs L14-20,
# L100-102 and L152-157 at rust-v0.160.0). XDG_RUNTIME_DIR lets `systemctl --user` reach the user manager and the
# messaging courier run (wave-2 synthesis X12), and DOCKER_HOST is the rootless Docker socket in it, the value the
# install plan's container stage exports (install.sh; https://docs.docker.com/engine/security/rootless/).
[shell_environment_policy]
inherit = "none"

[shell_environment_policy.set]
HOME = "${HOME}"
LANG = "C.UTF-8"
TERM = "xterm-256color"
TMPDIR = "/tmp"
# Preserve the explicit host-file identity under inherit = "none"; no distribution default.
WSL_DISTRO_NAME = "${WSL_DISTRO_NAME}"
XDG_RUNTIME_DIR = "${XDG_RUNTIME_DIR}"
DOCKER_HOST = "unix://${XDG_RUNTIME_DIR}/docker.sock"

# Wave 5: one stdio registration for browser automation and diagnostics.
# ChromeDevTools/chrome-devtools-mcp@e52c6b59:docs/client-configurations.md:109
[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.10.1", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
default_tools_approval_mode = "approve"
