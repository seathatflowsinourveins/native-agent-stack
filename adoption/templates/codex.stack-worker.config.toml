# Codex profile for max-quality GPT-6 worker lanes. Start a worker with the profile and the same three values
# pinned on its command line:
#   codex exec -p stack-worker -m gpt-6-astra -c model_reasoning_effort="max" -c web_search="live" -s <sandbox> ...
# A project .codex/config.toml outranks a profile file, and `-c` outranks both (codex-rs/config/src/
# config_layer_source.rs at rust-v0.157.1: profile 21, project 25, session flags 30). So the profile alone cannot
# guarantee the model, effort or web search in a checkout that sets them; it carries the tool settings below.
# Codex 0.134.0 and later layer $CODEX_HOME/<name>.config.toml over config.toml for --profile <name> (profile-v2),
# so this file holds only what a worker changes; the token-stack MCP servers themselves come from the user config
# (codex.config.template.toml). tools/adoption/apply_codex_lane.py installs it as $CODEX_HOME/stack-worker.config.toml.
# Decision record: docs/decisions/2026-09-26-codex-worker-lane.md.

model = "gpt-6-astra"
# max is the effort every GPT-6 step here runs at (blueprints/convergence-practice/gpt6-family-tiering-20260926,
# control arm A0), not the user default ultra. For gpt-6-astra, ultra sends xhigh (its catalog
# multi_agent_reasoning_effort) and turns on proactive sub-agent delegation; at max Codex sends max and tells the
# model not to spawn sub-agents unless asked (`codex -p stack-worker debug prompt-input` shows which).
model_reasoning_effort = "max"
# Live retrieval: the default cached mode searches an OpenAI-maintained index only, and a read-only or
# workspace-write sandbox keeps that default. A lane that must not browse passes -c web_search="disabled".
web_search = "live"

# These three servers declare no MCP tool annotations, so under approval_policy = "never" Codex refuses every call
# to them ("MCP tool call requires approval, but approval policy is never"). Workers get their read tools, approved.
[mcp_servers.ai-memory]
default_tools_approval_mode = "approve"
enabled_tools = ["memory_query", "memory_read_page", "memory_recent", "memory_status", "memory_briefing"]

# SocratiCode 1.14.0 starts a file watcher, which then updates the shared index, on any search or status call
# while SOCRATICODE_WATCHER is "auto" (the user config's value): dist/tools/query-tools.js handleQueryTool and
# dist/services/watcher.js ensureWatcherStarted. "manual" starts none. Graph and symbol tools are left out as
# well, since under "auto" they build a missing graph. A project config that sets the variable outranks this.
[mcp_servers.socraticode]
default_tools_approval_mode = "approve"
enabled_tools = ["codebase_search", "codebase_status", "codebase_list_projects", "codebase_health"]

[mcp_servers.socraticode.env]
SOCRATICODE_WATCHER = "manual"

[mcp_servers.headroom]
default_tools_approval_mode = "approve"
enabled_tools = ["headroom_compress", "headroom_retrieve", "headroom_stats"]

# ctx_upgrade leads to `context-mode upgrade`, which deletes [mcp_servers.context-mode] from config.toml;
# ctx_purge deletes indexed content.
[mcp_servers.context-mode]
disabled_tools = ["ctx_upgrade", "ctx_purge"]
