[marketplaces.context-mode]
source_type = "git"
source = "https://github.com/mksglu/context-mode.git"

[plugins."context-mode@context-mode"]
enabled = true

[features]
hooks = true
plugin_hooks = true

# Local ecosystem observation; content is removed before collector persistence.
[otel]
environment = "local"
log_user_prompt = false
exporter = { otlp-http = { endpoint = "http://${OTEL_ENDPOINT}/v1/logs", protocol = "binary" } }
metrics_exporter = { otlp-http = { endpoint = "http://${OTEL_ENDPOINT}/v1/metrics", protocol = "binary" } }
trace_exporter = "none"

[otel.tool_result]
max_bytes = 0

# App Server metrics use the explicitly configured local OTLP exporter.
[analytics]
enabled = true

# Native WSL defaults; regenerate PATH when adopting another host/runtime.
[shell_environment_policy.set]
PATH = "${ECO_ROOT}/bin:${HOST_PATH}"
RTK_TELEMETRY_DISABLED = "1"
