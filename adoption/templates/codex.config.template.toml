[marketplaces.context-mode]
source_type = "git"
source = "https://github.com/mksglu/context-mode.git"

[plugins."context-mode@context-mode"]
enabled = true

# Replaced by the session-bound [mcp_servers.context-mode] above.
[plugins."context-mode@context-mode".mcp_servers.context-mode]
enabled = false

[features]
hooks = true
# 0.157.x otherwise copies itself into CODEX_HOME/packages/app-server-daemon on its first interactive launch and
# starts a self-updating background app-server outside the pinned prefix
# (evidence/receipts/codex-01571-qualification-20260926.json); 0.155.1 accepts the key.
# Changed after `v2026.09.26.2` (the key is absent at that tag).
daemon_auto_start = false
# The shell snapshot (stable, on by default: codex-rs/features/src/lib.rs L1007-1012 at rust-v0.157.1) writes every
# exported variable, secrets included, into CODEX_HOME/shell_snapshots (shell-command/src/shell_snapshot_exports.rs);
# the landscape sweep's GPT-6 probe found a provider key there in a 0644 file (tools/sota-convergence/landscape-sweep/
# README.md). Without it each command runs as `shell -lc`, the same login shell the snapshot would have captured
# (core/src/tools/runtimes/mod.rs L268-276), at the cost of starting that shell per command.
shell_snapshot = false

# Notify only when Codex needs a decision: an approval (approval-requested), a plan-mode prompt or a `request_user_input` question (both
# reported as plan-mode-prompt, tui/src/chatwidget/tool_requests.rs L449-458 at rust-v0.155.1 and rust-v0.157.1) or an asynchronous question
# (async-question, added after 0.155.1, so inert at the macOS pin). `agent-turn-complete` (a finished turn) is left out on purpose. The list
# is plain strings, so a misspelled kind loads cleanly and never notifies; the kinds are type_name() in
# codex-rs/tui/src/chatwidget/notifications.rs. The channel stays Codex's own per-terminal `auto` (docs/decisions/2026-09-28-terminal-experience.md).
[tui]
notifications = ["approval-requested", "plan-mode-prompt", "async-question"]

# Local ecosystem observation; content is removed before collector persistence.
[otel]
environment = "local"
log_user_prompt = false
exporter = { otlp-http = { endpoint = "http://${OTEL_ENDPOINT}/v1/logs", protocol = "binary" } }
metrics_exporter = { otlp-http = { endpoint = "http://${OTEL_ENDPOINT}/v1/metrics", protocol = "binary" } }
trace_exporter = "none"

[otel.tool_result]
max_bytes = 0

# App Server metrics use the explicitly configured local OTLP exporter.
[analytics]
enabled = true

# Native WSL defaults; regenerate PATH when adopting another host/runtime.
[shell_environment_policy.set]
PATH = "${ECO_ROOT}/bin:${HOST_PATH}"
RTK_TELEMETRY_DISABLED = "1"
MCP_AUTO_OPEN_ENABLED = "false"
