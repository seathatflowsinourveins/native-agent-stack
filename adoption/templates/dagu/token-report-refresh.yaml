# Dagu 2.18.2 schema: dagucloud/dagu@5ca5c59f6b67734c9f0ae186bd59f5e0bb5846f4
# Source function: adoption/templates/systemd/token-report-refresh.service
# Private config is a pointer only. The co-op initializes it using the maintained CLI.
description: "Refresh this workstation's native token-report lifetime manifest"
schedule: "CRON_TZ=America/New_York 15 3,10,16,22 * * *"
hist_retention_days: 60
timeout_sec: 900
env:
  NATIVE_STACK_REPOSITORY: "${HOME}/code/native-agent-stack-live"
  NATIVE_STACK_TOKEN_REPORT_CONFIG: "${HOME}/.local/state/native-token-report/config.json"
  PATH: "${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${HOME}/.local/share/codex-ecosystem/bin:/usr/local/bin:/usr/bin:/bin"
  HEADROOM_UPDATE_CHECK: "off"
  HEADROOM_OFFLINE: "1"
  DO_NOT_TRACK: "1"
preconditions:
  - condition: /bin/sh -c 'case "$(/bin/date +%u%H)" in 60[5-8]|70[5-8]) exit 1;; esac'
steps:
  - name: refresh
    run: |
      umask 0077
      exec /usr/bin/setpriv --no-new-privs /usr/bin/nice -n 19 /usr/bin/ionice -c 3 \
        /usr/bin/python3 "${NATIVE_STACK_REPOSITORY}/tools/token-report/token_manifest.py" refresh \
        --config "${NATIVE_STACK_TOKEN_REPORT_CONFIG}"
    with:
      shell: ["/bin/bash", "-e", "-u", "-o", "pipefail"]
